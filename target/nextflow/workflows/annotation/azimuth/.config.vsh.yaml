- name: "workflows/multiomics/split_modalities"
  repository:
    type: "local"
- name: "convert/from_h5mu_or_h5ad_to_seurat"
  repository:
    type: "local"
- name: "annotate/azimuth"
  alias: "azimuth_component"
  repository:
    type: "local"
- name: "convert/from_seurat_to_h5mu"
  repository:
    type: "local"
- name: "transform/delete_layer"
  repository:
    type: "local"
- name: "dataflow/merge"
  repository:
    type: "local"
- name: "metadata/copy_modality_slots"
  repository:
    type: "local"
license: "MIT"
