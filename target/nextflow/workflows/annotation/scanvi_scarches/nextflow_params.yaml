# Dataset Input
param_list: ""
# ---

# Query Input
id: # please fill in - example: "foo"
input: # please fill in - example: "input.h5mu"
modality: "rna"
# layer: "value"
input_obs_batch_label: "sample_id"
# input_obs_size_factor: "value"
# input_obs_categorical_covariate: "value"
# input_obs_continuous_covariate: "value"
# input_var_gene_names: "value"
sanitize_ensembl_ids: true
# ---

# Reference Input
reference: # please fill in - example: "reference.h5mu"
reference_obs_target: # please fill in - example: "cell_type"
reference_obs_batch_label: "sample_id"
# reference_obs_size_factor: "value"
# reference_obs_categorical_covariate: "value"
# reference_obs_continuous_covariate: "value"
unlabeled_category: "Unknown"
reference_var_hvg: "filter_with_hvg"
# reference_var_gene_names: "value"
# ---

# Scvi, Scanvi And Scarches Training Options
# early_stopping: true
early_stopping_monitor: "elbo_validation"
early_stopping_patience: 45
early_stopping_min_delta: 0.0
# max_epochs: 0
reduce_lr_on_plateau: true
lr_factor: 0.6
lr_patience: 30.0
# ---

# Leiden Clustering Options
leiden_resolution: "1.0"
# ---

# Neighbor Classifier Arguments
knn_weights: "uniform"
knn_n_neighbors: 15
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
output_obs_predictions: "scanvi_pred"
output_obs_probability: "scanvi_probabilities"
output_obsm_integrated: "X_integrated_scanvi"
# output_compression: "gzip"
# output_model: "$id.$key.output.txt"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
