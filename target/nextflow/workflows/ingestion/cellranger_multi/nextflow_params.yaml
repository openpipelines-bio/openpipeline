# Gene Expression Arguments
gex_reference: # please fill in - example: "reference_genome.tar.gz"
gex_secondary_analysis: false
gex_generate_bam: false
# tenx_cloud_token_path: "input.txt"
# cell_annotation_model: "auto"
# gex_expect_cells: 3000
# gex_force_cells: 3000
gex_include_introns: true
# gex_r1_length: 0
# gex_r2_length: 0
gex_chemistry: "auto"
# ---

# Vdj Related Parameters
# vdj_reference: "reference_vdj.tar.gz"
# vdj_inner_enrichment_primers: "enrichment_primers.txt"
# vdj_r1_length: 0
# vdj_r2_length: 0
# vdj_denovo: true
# ---

# 3' Cell Multiplexing Parameters (Cellplex Multiplexing)
# cell_multiplex_oligo_ids: "value"
# min_assignment_confidence: 0.0
# cmo_set: "input.txt"
# barcode_sample_assignment: "input.txt"
# ---

# Hashtag Multiplexing Parameters
# hashtag_ids: "value"
# ---

# On-Chip Multiplexing Parameters
# ocm_barcode_ids: "value"
# ---

# Flex Multiplexing Paramaters
# probe_set: "input.txt"
# filter_probes: true
# probe_barcode_ids: "value"
# emptydrops_minimum_umis: 0
# ---

# Antigen Capture (Beam) Libary Arguments
# control_id: "value"
# mhc_allele: "value"
# ---

# General Arguments
check_library_compatibility: true
# ---

# Outputs
output_raw: # please fill in - example: "$id.$key.output_dir"
output_h5mu: # please fill in - example: "$id.$key.*.h5mu"
uns_metrics: "metrics_cellranger"
output_filtered_data: false
