# Dataset Input
param_list: ""
# ---

# Input
id: # please fill in - example: "foo"
input: # please fill in - example: "dataset.h5mu"
# layer: "value"
# ---

# Output
output: # please fill in - example: "$id.$key.output.h5mu"
# ---

# Filtering Options
# min_counts: 200
# max_counts: 5000000
# min_genes_per_cell: 200
# max_genes_per_cell: 1500000
# min_cells_per_gene: 3
# min_fraction_mito: 0.0
# max_fraction_mito: 0.2
# min_fraction_ribo: 0.0
# max_fraction_ribo: 0.2
skip_scrublet_doublet_detection: false
# scrublet_score_threshold: 0.0
# ---

# Mitochondrial & Ribosomal Gene Detection
# var_gene_names: "gene_symbol"
# var_name_mitochondrial_genes: "value"
# obs_name_mitochondrial_fraction: "value"
mitochondrial_gene_regex: "^[mM][tT]-"
# var_name_ribosomal_genes: "value"
# obs_name_ribosomal_fraction: "value"
ribosomal_gene_regex: "^[Mm]?[Rr][Pp][LlSs]"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
