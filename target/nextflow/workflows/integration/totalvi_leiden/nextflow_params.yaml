# Dataset Input
param_list: ""
# ---

# Inputs
id: # please fill in - example: "foo"
input: # please fill in - example: "input.h5mu"
rna_modality: "rna"
prot_modality: "prot"
# input_layer_rna: "value"
# input_layer_protein: "value"
obs_batch: "sample_id"
# obs_size_factor: "value"
# obs_categorical_covariate: "value"
# obs_continuous_covariate: "value"
# var_gene_names: "value"
# var_protein_names: "value"
# var_input: "value"
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
output_model: "totalvi_model_reference"
# ---

# Totalvi Training Options
# max_epochs: 0
early_stopping: true
# ---

# Totalvi Integration Options
obsm_integrated: "X_integrated_totalvi"
obsm_normalized_rna_output: "X_totalvi_normalized_rna"
obsm_normalized_protein_output: "X_totalvi_normalized_protein"
# ---

# Neighbour Calculation
uns_neighbors: "totalvi_integration_neighbors"
obsp_neighbor_distances: "totalvi_integration_distances"
obsp_neighbor_connectivities: "totalvi_integration_connectivities"
# ---

# Clustering Options
obs_cluster: "totalvi_integration_leiden"
leiden_resolution: "1.0"
# ---

# Umap Options
obsm_umap: "X_totalvi_umap"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
