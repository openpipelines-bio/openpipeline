# Dataset Input
param_list: ""
# ---

# Inputs
# input: "dataset.h5mu"
# tiledb_input_uri: "s3://bucket/path"
# tiledb_s3_region: "us-west-2"
# tiledb_endpoint: "value"
tiledb_s3_no_sign_request: false
# ---

# Input Slots
layer: "log_normalized"
modality: "rna"
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
# output_tiledb: "$id.$key.output.txt"
# ---

# Neighbour Calculation
uns_neighbors: "harmonypy_integration_neighbors"
obsp_neighbor_distances: "harmonypy_integration_distances"
obsp_neighbor_connectivities: "harmonypy_integration_connectivities"
# ---

# Harmony Integration Options
embedding: "X_pca"
obsm_integrated: "X_pca_integrated"
obs_covariates: # please fill in - example: "batch;sample"
theta: "2.0"
# ---

# Clustering Options
obs_cluster: "harmony_integration_leiden"
leiden_resolution: "1.0"
# ---

# Umap Options
obsm_umap: "X_leiden_harmony_umap"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
