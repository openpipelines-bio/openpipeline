# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
modality: "rna"
# input_layer: "value"
# input_var_gene_names: "value"
input_reference_gene_overlap: 100
sanitize_ensembl_ids: true
# ---

# Ontology
cl_nlp_emb_file: # please fill in - example: "cl.ontology.nlp.emb"
cl_ontology_file: # please fill in - example: "cl.ontology"
cl_obo_file: # please fill in - example: "cl.obo"
# ---

# Reference
# reference: "reference.h5mu"
# reference_layer: "value"
reference_obs_target: # please fill in - example: "cell_ontology_class"
# reference_var_gene_names: "value"
# reference_var_input: "value"
unknown_celltype: "Unknown"
# ---

# Outputs
# output: "$id.$key.output.h5mu"
output_obs_predictions: "onclass_pred"
output_obs_probability: "onclass_prob"
# output_compression: "gzip"
# ---

# Model Arguments
# model: "value"
max_iter: 30
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
