name: "azimuth_panhuman"
namespace: "annotate"
version: "main_build"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  info:
    links:
      github: "mimi-DT"
      linkedin: "mirtedt"
argument_groups:
- name: "Inputs"
  description: "Input dataset (query) arguments"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "The input (query) data to be annotated. Should be a .h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_layer"
    description: "The layer in the input data containing raw (unnormalized) counts.\n\
      Azimuth performs its own normalization internally and expects\ninteger counts;\
      \ if not provided, `.X` is used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_var_gene_names"
    description: "The name of the .var column in the input data containing gene\n\
      symbols. The Azimuth model was trained on gene symbols rather than\nEnsembl\
      \ IDs, so this column must contain gene symbols for the model\nto work correctly.\n"
    info: null
    default:
    - "gene_symbol"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--input_reference_gene_overlap"
    description: "The minimum number of genes required to be present in both the\n\
      query dataset and the Azimuth reference gene panel. Genes in the\nreference\
      \ panel that are absent from the query are silently\nzero-filled by Azimuth,\
      \ so too little overlap produces unreliable\npredictions rather than an outright\
      \ failure; this argument turns\nthat situation into an explicit error.\n"
    info: null
    default:
    - 100
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Model"
  description: "Arguments controlling the pre-trained Azimuth neural network. There\
    \ is\nno reference/training step: the model is fixed and its weights are\ndownloaded\
    \ automatically on first use, unless a local copy is\nprovided with `--model`.\n"
  arguments:
  - type: "file"
    name: "--model"
    description: "Path to a pre-downloaded Azimuth inference model (a `.keras` file,\n\
      as published on Zenodo: https://zenodo.org/records/20401417). When\nprovided,\
      \ the model is used instead of downloading it, for\noffline component run. The\
      \ file must match `--model_version`.\nIf not provided, the weights are downloaded\
      \ automatically on first use.\n"
    info: null
    example:
    - "panhumanpy_inference_model_v1.keras"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--model_version"
    description: "Which version of the pre-trained Azimuth model to use. Model\nweights\
      \ are versioned separately from the panhumanpy package;\ncurrently available\
      \ versions are 'v0' and 'v1' ('v1' additionally\napplies confidence calibration).\n"
    info: null
    default:
    - "v1"
    required: false
    choices:
    - "v0"
    - "v1"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--eval_batch_size"
    description: "Batch size used during model inference and minibatched annotation."
    info: null
    default:
    - 8192
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--normalization_override"
    description: "Skip Azimuth's internal normalization and treat `--input_layer`\n\
      (or `.X`) as already log-normalized, instead of raw counts.\nCounts must be\
      \ normalized to a target sum of 10000 per cell\n(i.e. `sc.pp.normalize_total(target_sum=1e4)`\
      \ followed by\n`sc.pp.log1p()`); the component verifies this and raises an error\n\
      if the data does not match. Without this flag, the component\ninstead verifies\
      \ that the data looks like raw (integer) counts,\nrather than silently normalizing\
      \ already-normalized data a\nsecond time. Only set this flag if your data is\
      \ already\nnormalized in this way.\n"
    info: null
    direction: "input"
  - type: "integer"
    name: "--norm_check_batch_size"
    description: "Number of cells sampled to determine whether the input counts are\
      \ already normalized."
    info: null
    default:
    - 100
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--refine_labels"
    description: "Whether to post-process the raw hierarchical predictions into\n\
      broad, medium and fine labels with consistent granularity across\ncell types,\
      \ stored in `--output_obs_predictions_broad`,\n`--output_obs_predictions_medium`\
      \ and `--output_obs_predictions_fine`.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Embeddings and UMAP"
  description: "Arguments controlling extraction of the Azimuth neural network's\n\
    internal cell embeddings, and an optional UMAP projection thereof.\n"
  arguments:
  - type: "boolean"
    name: "--extract_embeddings"
    description: "Whether to extract the Azimuth neural network embeddings for each\
      \ cell."
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--umap_embeddings"
    description: "Whether to compute a UMAP projection of the extracted embeddings.\n\
      Requires `--extract_embeddings true`.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--umap_n_neighbors"
    description: "Number of neighbors to consider for each point in the UMAP."
    info: null
    default:
    - 30
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--umap_n_components"
    description: "Dimensionality of the UMAP projection."
    info: null
    default:
    - 2
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--umap_metric"
    description: "Distance metric to use for the UMAP."
    info: null
    default:
    - "cosine"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--umap_min_dist"
    description: "Minimum distance between points in the UMAP projection."
    info: null
    default:
    - 0.3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--umap_lr"
    description: "UMAP learning rate."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--umap_seed"
    description: "Random seed for reproducibility of the UMAP."
    info: null
    default:
    - 42
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--umap_spread"
    description: "Scales the effective scale of embedded points in the UMAP."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--umap_init"
    description: "Initialization method for the UMAP."
    info: null
    default:
    - "spectral"
    required: false
    choices:
    - "spectral"
    - "random"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--umap_verbose"
    description: "Whether to print UMAP progress to the log."
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  description: "Output arguments."
  arguments:
  - type: "file"
    name: "--output"
    description: "Output h5mu file."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_predictions"
    description: "In which `.obs` column to store the most granular ('final level')\n\
      predicted cell type label. Only the `.obs` columns set with the\n`--output_obs_*`\
      \ arguments are added; other columns produced by\nAzimuth are not stored.\n"
    info: null
    default:
    - "azimuth_pred"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_probability"
    description: "In which `.obs` column to store the confidence score of the\n`--output_obs_predictions`\
      \ label (calibrated for `--model_version v1`).\n"
    info: null
    default:
    - "azimuth_probability"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_predictions_broad"
    description: "In which `.obs` column to store the refined broad-granularity cell\n\
      type label. Only used if `--refine_labels` is set.\n"
    info: null
    default:
    - "azimuth_broad"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_predictions_medium"
    description: "In which `.obs` column to store the refined medium-granularity cell\n\
      type label. Only used if `--refine_labels` is set.\n"
    info: null
    default:
    - "azimuth_medium"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_predictions_fine"
    description: "In which `.obs` column to store the refined fine-granularity cell\n\
      type label. Only used if `--refine_labels` is set.\n"
    info: null
    default:
    - "azimuth_fine"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obsm_embedding"
    description: "In which `.obsm` slot to store the extracted Azimuth embeddings.\n\
      Only used if `--extract_embeddings` is set.\n"
    info: null
    default:
    - "X_azimuth"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obsm_umap"
    description: "In which `.obsm` slot to store the UMAP projection.\nOnly used if\
      \ `--umap_embeddings` is set.\n"
    info: null
    default:
    - "X_azimuth_umap"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata H5\
      \ files.\nBy default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "cross_check_genes.py"
- type: "file"
  path: "set_var_index.py"
- type: "file"
  path: "is_lognormalized.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Automated cell type annotation using Pan-human Azimuth, a neural network\n\
  pre-trained on a pan-human single-cell atlas by the Satija lab.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "pbmc_1k_protein_v3_filtered_feature_bc_matrix.h5mu"
- type: "file"
  path: "panhumanpy_inference_model_v1.keras"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midcpu"
    - "highmem"
    - "highdisk"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.12-slim"
  target_tag: "main_build"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    packages:
    - "panhumanpy[gpu]==1.0.0"
    upgrade: true
  - type: "python"
    user: false
    packages:
    - "anndata~=0.12.16"
    - "awkward"
    - "scipy~=1.17.1"
    - "mudata~=0.3.8"
    script:
    - "exec(\"try:\\n  import zarr; from importlib.metadata import version\\nexcept\
      \ ModuleNotFoundError:\\n  exit(0)\\nelse:  assert int(version(\\\"zarr\\\"\
      ).partition(\\\".\\\")[0]) > 2\")"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.10.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/annotate/azimuth_panhuman/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/annotate/azimuth_panhuman"
  executable: "target/nextflow/annotate/azimuth_panhuman/main.nf"
  viash_version: "0.9.7"
  git_commit: "e35e8c713a32871a487ba7d1fcbb97fb27f04bbf"
  git_remote: "https://github.com/openpipelines-bio/openpipeline"
package_config:
  name: "openpipeline"
  summary: "Best-practice workflows for single-cell multi-omics analyses.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nIn terms of workflows, the following has been made available, but keep in mind\
    \ that\nindividual tools and functionality can be executed as standalone components\
    \ as well.\n\n  * Demultiplexing: conversion of raw sequencing data to FASTQ objects.\n\
    \  * Ingestion: Read mapping and generating a count matrix.\n  * Single sample\
    \ processing: cell filtering and doublet detection.\n  * Multisample processing:\
    \ Count transformation, normalization, QC metric calulations.\n  * Integration:\
    \ Clustering, integration and batch correction using single and multimodal methods.\n\
    \  * Downstream analysis workflows\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-data"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".version := \"main_build\""
  - ".engines[.type == 'docker'].target_tag := 'main_build'"
  keywords:
  - "single-cell"
  - "multimodal"
  license: "MIT"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline/issues"
