# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
modality: "rna"
# input_layer: "value"
# var_input: "value"
# var_gene_names: "value"
obs_labels: # please fill in - example: "value"
unlabeled_category: "Unknown"
sanitize_ensembl_ids: true
# ---

# Scvi Model
scvi_model: # please fill in - example: "scvi_model.pt"
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
# output_model: "$id.$key.path/to/output_model"
obsm_output: "X_scanvi_integrated"
obs_output_predictions: "scanvi_pred"
obs_output_probabilities: "scanvi_proba"
# output_compression: "gzip"
# ---

# Scanvi Training Arguments
# early_stopping: true
early_stopping_monitor: "elbo_validation"
early_stopping_patience: 45
early_stopping_min_delta: 0.0
# max_epochs: 0
reduce_lr_on_plateau: true
lr_factor: 0.6
lr_patience: 30.0
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
