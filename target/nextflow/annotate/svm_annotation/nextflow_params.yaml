# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
modality: "rna"
# input_layer: "value"
# input_var_gene_names: "value"
input_reference_gene_overlap: 100
sanitize_ensembl_ids: true
# ---

# Reference
# reference: "reference.h5mu"
# reference_layer: "value"
reference_obs_target: # please fill in - example: "value"
# reference_var_gene_names: "value"
# reference_var_input: "value"
# ---

# Outputs
# output: "$id.$key.output.h5mu"
output_obs_prediction: "svm_pred"
output_obs_probability: "svm_probability"
# output_compression: "gzip"
# ---

# Model Arguments
# model: "pretrained_model.pkl"
feature_selection: true
max_iter: 5000
c_reg: 1.0
class_weight: "balanced"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
