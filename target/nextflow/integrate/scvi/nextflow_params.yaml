# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
modality: "rna"
# input_layer: "value"
obs_batch: "sample_id"
# var_gene_names: "value"
# var_input: "value"
# obs_labels: "value"
# obs_size_factor: "value"
# obs_categorical_covariate: "value"
# obs_continuous_covariate: "value"
sanitize_ensembl_ids: true
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
# output_model: "$id.$key.output.txt"
obsm_output: "X_scvi_integrated"
# output_compression: "gzip"
# ---

# Scvi Options
n_hidden_nodes: 128
n_dimensions_latent_space: 30
n_hidden_layers: 2
dropout_rate: 0.1
dispersion: "gene"
gene_likelihood: "nb"
# ---

# Variational Auto-Encoder Model Options
use_layer_normalization: "both"
use_batch_normalization: "none"
encode_covariates: true
deeply_inject_covariates: false
use_observed_lib_size: false
# ---

# Early Stopping Arguments
# early_stopping: true
early_stopping_monitor: "elbo_validation"
early_stopping_patience: 45
early_stopping_min_delta: 0.0
# ---

# Learning Parameters
# max_epochs: 0
reduce_lr_on_plateau: true
lr_factor: 0.6
lr_patience: 30.0
# ---

# Data Validition
n_obs_min_count: 0
n_var_min_count: 0
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
