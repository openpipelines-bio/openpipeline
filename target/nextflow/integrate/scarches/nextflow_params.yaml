# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
# layer: "value"
modality: "rna"
# input_obs_batch: "value"
# input_obs_label: "value"
# input_var_gene_names: "value"
# input_obs_size_factor: "value"
# input_obs_categorical_covariate: "value"
# input_obs_continuous_covariate: "value"
sanitize_ensembl_ids: true
# ---

# Reference
reference: # please fill in - example: "path/to/reference"
# reference_class: "SCANVI"
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.h5mu"
model_output: "model"
obsm_output: "X_integrated_scanvi"
obs_output_predictions: "scanvi_pred"
obs_output_probabilities: "scanvi_proba"
# output_compression: "gzip"
# ---

# Early Stopping Arguments
# early_stopping: true
early_stopping_monitor: "elbo_validation"
early_stopping_patience: 45
early_stopping_min_delta: 0.0
# ---

# Learning Parameters
# max_epochs: 0
reduce_lr_on_plateau: true
lr_factor: 0.6
lr_patience: 30.0
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
