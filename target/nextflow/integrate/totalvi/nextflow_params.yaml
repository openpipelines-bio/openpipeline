# Dataset Input
param_list: ""
# ---

# Inputs
input: # please fill in - example: "input.h5mu"
rna_modality: "rna"
prot_modality: "prot"
# input_layer_rna: "value"
# input_layer_protein: "value"
obs_batch: "sample_id"
# obs_size_factor: "value"
# obs_categorical_covariate: "value"
# obs_continuous_covariate: "value"
# var_gene_names: "value"
# var_protein_names: "value"
# var_input: "value"
# ---

# Data Validity Checks
n_obs_min_count: 0
n_var_gene_min_count: 0
n_var_protein_min_count: 0
# ---

# Model Arguments
n_dimensions_latent_space: 20
gene_dispersion: "gene"
protein_dispersion: "protein"
gene_likelihood: "nb"
latent_distribution: "normal"
# empirical_protein_background_prior: true
override_missing_proteins: false
# ---

# Training Arguments
# max_epochs: 0
early_stopping: true
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.txt"
output_model: "totalvi_model_reference"
obsm_output: "X_integrated_totalvi"
obsm_normalized_rna_output: "X_totalvi_normalized_rna"
obsm_normalized_protein_output: "X_totalvi_normalized_protein"
# output_compression: "gzip"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
