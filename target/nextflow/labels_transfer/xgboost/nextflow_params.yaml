# Dataset Input
param_list: ""
# ---

# Input Dataset (Query) Arguments
input: # please fill in - example: "input.h5mu"
modality: "rna"
# input_obsm_features: "X_scvi"
# ---

# Reference Dataset Arguments
# reference: "reference.h5mu"
# reference_obsm_features: "X_scvi"
reference_obs_targets: "ann_level_1;ann_level_2;ann_level_3;ann_level_4;ann_level_5;ann_finest_level"
# ---

# Outputs
output: # please fill in - example: "$id.$key.output.txt"
# output_obs_predictions: "value"
# output_obs_probability: "value"
# output_compression: "gzip"
# ---

# Execution Arguments
force_retrain: false
use_gpu: false
verbosity: 1
model_output: "model"
output_uns_parameters: "xgboost_parameters"
# ---

# Learning Parameters
learning_rate: 0.3
min_split_loss: 0.0
max_depth: 6
min_child_weight: 1
max_delta_step: 0.0
subsample: 1.0
sampling_method: "uniform"
colsample_bytree: 1.0
colsample_bylevel: 1.0
colsample_bynode: 1.0
reg_lambda: 1.0
reg_alpha: 0.0
scale_pos_weight: 1.0
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
