# Dataset Input
param_list: ""
# ---

# Arguments
input: # please fill in - example: "input.h5mu"
modality: "rna"
# layer: "value"
# output: "$id.$key.output.h5mu"
obs_name_filter: "filter_with_scrublet"
do_subset: false
obs_name_doublet_score: "scrublet_doublet_score"
# expected_doublet_rate: 0.0
# stdev_doublet_rate: 0.0
# n_neighbors: 0
# sim_doublet_ratio: 0.0
min_counts: 2
min_cells: 3
min_gene_variablity_percent: 85.0
num_pca_components: 30
distance_metric: "euclidean"
# scrublet_score_threshold: 0.0
allow_automatic_threshold_detection_fail: false
# output_compression: "gzip"
# ---

# Nextflow Input-Output Arguments
publish_dir: # please fill in - example: "$id.$key.output/"
# ---
