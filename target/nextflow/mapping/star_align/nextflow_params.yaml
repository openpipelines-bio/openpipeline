# Dataset Input
param_list: ""
# ---

# Input_Output
input: # please fill in - example: "mysample_S1_L001_R1_001.fastq.gz;mysample_S1_L001_R2_001.fastq.gz"
reference: # please fill in - example: "/path/to/reference"
output: # please fill in - example: "$id.$key./path/to/foo"
# ---

# Run Parameters
# runRNGseed: 777
# ---

# Genome Parameters
# genomeLoad: "NoSharedMemory"
# genomeFastaFiles: "genome.fasta"
# genomeFileSizes: "0"
# genomeTransformOutput: "value"
# genomeChrSetMitochondrial: "chrM;M;MT"
# ---

# Splice Junctions Database
# sjdbFileChrStartEnd: "value"
# sjdbGTFfile: "annotation.gtf"
# sjdbGTFchrPrefix: "value"
# sjdbGTFfeatureExon: "exon"
# sjdbGTFtagExonParentTranscript: "transcript_id"
# sjdbGTFtagExonParentGene: "gene_id"
# sjdbGTFtagExonParentGeneName: "gene_name"
# sjdbGTFtagExonParentGeneType: "gene_type;gene_biotype"
# sjdbOverhang: 100
# sjdbScore: 2
# sjdbInsertSave: "Basic"
# ---

# Variation Parameters
# varVCFfile: "value"
# ---

# Read Parameters
# readFilesType: "Fastx"
# readFilesSAMattrKeep: "All"
# readFilesManifest: "manifest.txt"
# readFilesPrefix: "value"
# readFilesCommand: "value"
# readMapNumber: -1
# readMatesLengthsIn: "NotEqual"
# readNameSeparator: "/"
# readQualityScoreBase: 33
# ---

# Read Clipping
# clipAdapterType: "Hamming"
# clip3pNbases: "0"
# clip3pAdapterSeq: "value"
# clip3pAdapterMMp: "0.1"
# clip3pAfterAdapterNbases: "0"
# clip5pNbases: "0"
# ---

# Limits
# limitGenomeGenerateRAM: 31000000000
# limitIObufferSize: "30000000;50000000"
# limitOutSAMoneReadBytes: 100000
# limitOutSJoneRead: 1000
# limitOutSJcollapsed: 1000000
# limitBAMsortRAM: 0
# limitSjdbInsertNsj: 1000000
# limitNreadsSoft: -1
# ---

# Output: General
# outTmpKeep: "value"
# outStd: "Log"
# outReadsUnmapped: "value"
# outQSconversionAdd: 0
# outMultimapperOrder: "Old_2.4"
# ---

# Output: Sam And Bam
# outSAMtype: "SAM"
# outSAMmode: "Full"
# outSAMstrandField: "value"
# outSAMattributes: "Standard"
# outSAMattrIHstart: 1
# outSAMunmapped: "value"
# outSAMorder: "Paired"
# outSAMprimaryFlag: "OneBestScore"
# outSAMreadID: "Standard"
# outSAMmapqUnique: 255
# outSAMflagOR: 0
# outSAMflagAND: 65535
# outSAMattrRGline: "value"
# outSAMheaderHD: "value"
# outSAMheaderPG: "value"
# outSAMheaderCommentFile: "value"
# outSAMfilter: "value"
# outSAMmultNmax: -1
# outSAMtlen: 1
# outBAMcompression: 1
# outBAMsortingThreadN: 0
# outBAMsortingBinsN: 50
# ---

# Bam Processing
# bamRemoveDuplicatesType: "value"
# bamRemoveDuplicatesMate2basesN: 0
# ---

# Output Wiggle
# outWigType: "value"
# outWigStrand: "Stranded"
# outWigReferencesPrefix: "value"
# outWigNorm: "RPM"
# ---

# Output Filtering
# outFilterType: "Normal"
# outFilterMultimapScoreRange: 1
# outFilterMultimapNmax: 10
# outFilterMismatchNmax: 10
# outFilterMismatchNoverLmax: 0.3
# outFilterMismatchNoverReadLmax: 1.0
# outFilterScoreMin: 0
# outFilterScoreMinOverLread: 0.66
# outFilterMatchNmin: 0
# outFilterMatchNminOverLread: 0.66
# outFilterIntronMotifs: "value"
# outFilterIntronStrands: "RemoveInconsistentStrands"
# ---

# Output Splice Junctions (Sj.Out.Tab)
# outSJtype: "Standard"
# ---

# Output Filtering: Splice Junctions
# outSJfilterReads: "All"
# outSJfilterOverhangMin: "30;12;12;12"
# outSJfilterCountUniqueMin: "3;1;1;1"
# outSJfilterCountTotalMin: "3;1;1;1"
# outSJfilterDistToOtherSJmin: "10;0;5;10"
# outSJfilterIntronMaxVsReadN: "50000;100000;200000"
# ---

# Scoring
# scoreGap: 0
# scoreGapNoncan: -8
# scoreGapGCAG: -4
# scoreGapATAC: -8
# scoreGenomicLengthLog2scale: 0
# scoreDelOpen: -2
# scoreDelBase: -2
# scoreInsOpen: -2
# scoreInsBase: -2
# scoreStitchSJshift: 1
# ---

# Alignments And Seeding
# seedSearchStartLmax: 50
# seedSearchStartLmaxOverLread: 1.0
# seedSearchLmax: 0
# seedMultimapNmax: 10000
# seedPerReadNmax: 1000
# seedPerWindowNmax: 50
# seedNoneLociPerWindow: 10
# seedSplitMin: 12
# seedMapMin: 5
# alignIntronMin: 21
# alignIntronMax: 0
# alignMatesGapMax: 0
# alignSJoverhangMin: 5
# alignSJstitchMismatchNmax: "0;-1;0;0"
# alignSJDBoverhangMin: 3
# alignSplicedMateMapLmin: 0
# alignSplicedMateMapLminOverLmate: 0.66
# alignWindowsPerReadNmax: 10000
# alignTranscriptsPerWindowNmax: 100
# alignTranscriptsPerReadNmax: 10000
# alignEndsType: "Local"
# alignEndsProtrude: "0    ConcordantPair"
# alignSoftClipAtReferenceEnds: "Yes"
# alignInsertionFlush: "value"
# ---

# Paired-End Reads
# peOverlapNbasesMin: 0
# peOverlapMMp: 0.01
# ---

# Windows, Anchors, Binning
# winAnchorMultimapNmax: 50
# winBinNbits: 16
# winAnchorDistNbins: 9
# winFlankNbins: 4
# winReadCoverageRelativeMin: 0.5
# winReadCoverageBasesMin: 0
# ---

# Chimeric Alignments
# chimOutType: "Junctions"
# chimSegmentMin: 0
# chimScoreMin: 0
# chimScoreDropMax: 20
# chimScoreSeparation: 10
# chimScoreJunctionNonGTAG: -1
# chimJunctionOverhangMin: 20
# chimSegmentReadGapMax: 0
# chimFilter: "banGenomicN"
# chimMainSegmentMultNmax: 10
# chimMultimapNmax: 0
# chimMultimapScoreRange: 1
# chimNonchimScoreDropMin: 20
# chimOutJunctionFormat: 0
# ---

# Quantification Of Annotations
# quantMode: "value"
# quantTranscriptomeBAMcompression: 1
# quantTranscriptomeBan: "IndelSoftclipSingleend"
# ---

# 2-Pass Mapping
# twopassMode: "value"
# twopass1readsN: -1
# ---

# Wasp Parameters
# waspOutputMode: "value"
# ---

