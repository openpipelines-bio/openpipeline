name: "azimuth_reference"
namespace: "annotate"
version: "integration_build"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  info:
    links:
      github: "mimi-DT"
      linkedin: "mirtedt"
argument_groups:
- name: "Inputs"
  description: "Input (reference) dataset arguments"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "The annotated data to build the reference from. Should be an .rds\n\
      file containing a Seurat object with raw (unnormalized) counts in\nthe layer\
      \ specified by `--input_layer`, and the cell type labels to\ntransfer in its\
      \ cell metadata.\n"
    info: null
    example:
    - "input.rds"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--assay"
    description: "Name of the Seurat assay in the input object to build the reference\
      \ from.\n"
    info: null
    default:
    - "RNA"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_layer"
    description: "Layer of `--assay` containing the raw (unnormalized) counts.\nThese\
      \ are normalized using SCTransform.\n"
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_var_gene_names"
    description: "Column in the feature metadata of `--assay` containing gene symbols.\n\
      If not provided, the feature names of the assay are used. The gene\nnames of\
      \ the reference should be gene symbols: annotate/azimuth\nconverts query Ensembl\
      \ IDs to gene symbols, but not the other way\naround.\n"
    info: null
    example:
    - "gene_symbol"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Reference"
  description: "Arguments controlling the content of the reference."
  arguments:
  - type: "string"
    name: "--annotation_levels"
    description: "Columns in the cell metadata of the input object containing the\n\
      cell type labels (annotation levels) to store in the reference, and\ntransfer\
      \ to the query with annotate/azimuth. Cells with missing\nlabels are not allowed.\n"
    info: null
    example:
    - "celltype.l1"
    - "celltype.l2"
    required: true
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--reference_version"
    description: "Version number for the new custom reference."
    info: null
    default:
    - "0.0.0"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Reference building arguments"
  description: "Lower-level arguments for building the reference."
  arguments:
  - type: "integer"
    name: "--n_variable_features"
    description: "Number of variable features to select with SCTransform."
    info: null
    default:
    - 3000
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_dims"
    description: "Number of dimensions of the PCA and supervised PCA, which are also\n\
      used to compute the UMAP and to find neighbors in the reference.\nAzimuth requires\
      \ references to contain at least 50 dimensions.\n"
    info: null
    default:
    - 50
    required: false
    min: 50
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--k_param"
    description: "Number of nearest neighbors stored in the reference annoy index\n\
      (used to find anchors between query and reference).\n"
    info: null
    default:
    - 31
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--seed"
    description: "Random seed for SCTransform and the UMAP."
    info: null
    default:
    - 42
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  description: "Output arguments."
  arguments:
  - type: "file"
    name: "--output"
    description: "Output directory to which the Azimuth reference is written, as a\n\
      \"ref.Rds\" and \"idx.annoy\" file pair. Can be passed to annotate/azimuth\n\
      using `--reference custom --custom_reference <output>`.\n"
    info: null
    example:
    - "azimuth_reference"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "r_script"
  path: "script.R"
  is_executable: true
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Build a custom Azimuth reference from an annotated Seurat object, using\n\
  Azimuth's AzimuthReference(). The raw counts are normalized with\nSCTransform, after\
  \ which a supervised PCA (SPCA) and a UMAP model are\ncomputed and packaged together\
  \ with the annotation levels to transfer.\nThe output is a directory containing\
  \ a \"ref.Rds\" and \"idx.annoy\" file\npair, which can be used to annotate query\
  \ datasets with annotate/azimuth\n(`--reference custom --custom_reference <output>`).\n"
test_resources:
- type: "r_script"
  path: "test.R"
  is_executable: true
- type: "file"
  path: "TS_Blood_filtered.rds"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
