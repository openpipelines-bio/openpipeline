name: "azimuth"
namespace: "annotate"
version: "integration_build"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  info:
    links:
      github: "mimi-DT"
      linkedin: "mirtedt"
argument_groups:
- name: "Inputs"
  description: "Input dataset (query) arguments"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "The input (query) data to be annotated. Should be an .rds file\n\
      containing a Seurat object with raw (unnormalized) counts in the\nlayer specified\
      \ by `--input_layer`.\n"
    info: null
    example:
    - "input.rds"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--assay"
    description: "Name of the Seurat assay in the input object to run the annotation\
      \ on.\n"
    info: null
    default:
    - "RNA"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_layer"
    description: "Layer of `--assay` containing the raw (unnormalized) counts.\nRunAzimuth()\
      \ normalizes these internally using SCTransform.\n"
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_var_gene_names"
    description: "Column in the feature metadata of `--assay` containing gene symbols.\n\
      If not provided, the feature names of the assay are used. Azimuth\nreferences\
      \ use gene symbols; when the query features are Ensembl IDs,\nAzimuth converts\
      \ them using a homolog table downloaded at runtime.\n"
    info: null
    example:
    - "gene_symbol"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--input_reference_gene_overlap"
    description: "Minimum number of genes that must overlap between the query and\
      \ the\nreference for the mapping to be performed.\n"
    info: null
    default:
    - 100
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Reference"
  description: "Arguments controlling which Azimuth reference to map the query onto.\n\
    There is no training step: RunAzimuth() maps the query directly onto\nthe chosen\
    \ reference's precomputed embeddings.\n"
  arguments:
  - type: "string"
    name: "--reference"
    description: "Name of a curated Azimuth reference, downloaded and installed\n\
      automatically on first use via SeuratData. See\nhttps://azimuth.hubmapconsortium.org/references/\
      \ for a description\nof each reference. Set to \"custom\" to use a local reference\
      \ instead,\nprovided via `--custom_reference`.\n"
    info: null
    example:
    - "pbmcref"
    required: true
    choices:
    - "pbmcref"
    - "bonemarrowref"
    - "lungref"
    - "heartref"
    - "tonsilref"
    - "humancortexref"
    - "mousecortexref"
    - "kidneyref"
    - "pancreasref"
    - "adiposeref"
    - "fetusref"
    - "custom"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--custom_reference"
    description: "Path to a local directory containing a \"ref.Rds\" and \"idx.annoy\"\
      \nfile pair for a custom reference. If provided, `--reference` must\nbe set\
      \ to \"custom\".\n"
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--annotation_levels"
    description: "Which annotation levels (columns in the reference's metadata,\n\
      e.g. \"celltype.l1\", \"celltype.l2\") to transfer. If not provided,\nall annotation\
      \ levels available in the reference are transferred.\n"
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--do_adt"
    description: "Whether to impute a protein (ADT) assay from the reference, if\n\
      the reference includes antibody-derived tag data.\n"
    info: null
    direction: "input"
- name: "Mapping arguments"
  description: "Lower-level arguments passed through to RunAzimuth()."
  arguments:
  - type: "integer"
    name: "--k_weight"
    description: "Number of neighbors to consider when weighting anchors during label/embedding\
      \ transfer."
    info: null
    default:
    - 50
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_trees"
    description: "Number of trees used when building the annoy index for neighbor\
      \ search."
    info: null
    default:
    - 20
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--mapping_score_k"
    description: "Number of neighbors used to compute the per-cell mapping score."
    info: null
    default:
    - 100
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  description: "Output arguments."
  arguments:
  - type: "file"
    name: "--output"
    description: "Output .rds file containing the input Seurat object, extended with\n\
      the Azimuth results: the predicted labels, prediction scores and\nmapping score\
      \ in the cell metadata (see `--output_obs_*`), the\nreference projected UMAP\
      \ and integrated reductions (see\n`--output_obsm_*`), and a `prediction.score.<level>`\
      \ assay per\nannotation level (plus an `impADT` assay when `--do_adt` is set).\n"
    info: null
    example:
    - "output.rds"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression used when writing the output .rds file."
    info: null
    default:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "bzip2"
    - "xz"
    - "none"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_predictions"
    description: "In which cell metadata columns to store the predicted labels.\n\
      If provided, `--annotation_levels` must be provided as well, and both\nmust\
      \ have the same length. If not provided, defaults to\n`azimuth_pred_<level>`,\
      \ with \".\" in the level name replaced by \"_\".\n"
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_probability"
    description: "In which cell metadata columns to store the prediction scores.\n\
      If provided, `--annotation_levels` must be provided as well, and both\nmust\
      \ have the same length. If not provided, defaults to\n`azimuth_probability_<level>`,\
      \ with \".\" in the level name replaced by \"_\".\n"
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--output_obs_mapping_score"
    description: "In which cell metadata column to store the per-cell mapping score."
    info: null
    default:
    - "azimuth_mapping_score"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obsm_umap"
    description: "Name of the reduction in which to store the query embedding projected\n\
      onto the reference UMAP.\n"
    info: null
    default:
    - "X_azimuth_umap"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obsm_integrated"
    description: "Name of the reduction in which to store the integrated\n(reference-projected)\
      \ embedding.\n"
    info: null
    default:
    - "X_integrated_azimuth"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "r_script"
  path: "script.R"
  is_executable: true
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Reference-based cell type annotation using Seurat's Azimuth (RunAzimuth()).\n\
  Unlike annotate/azimuth_panhuman (which uses a single fixed pan-human neural network\n\
  with no reference choice), this component lets you pick which annotated\nreference\
  \ dataset to map the query onto: one of the curated Azimuth\nreferences (e.g. \"\
  pbmcref\", \"bonemarrowref\", \"lungref\"; see\nhttps://azimuth.hubmapconsortium.org/references/\
  \ for the full, up to date\nlist), or a local directory containing a custom \"ref.Rds\"\
  \ + \"idx.annoy\"\nreference pair.\n"
test_resources:
- type: "r_script"
  path: "test.R"
  is_executable: true
- type: "file"
  path: "pbmc_1k_protein_v3_mms.rds"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "highcpu"
    - "highmem"
    - "highdisk"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "rocker/r2u:24.04"
  target_tag: "integration_build"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "libhdf5-dev"
    - "libgeos-dev"
    interactive: false
  - type: "r"
    cran:
    - "hdf5r"
    - "Seurat"
    - "SeuratObject"
    - "remotes"
    bioc_force_install: false
    warnings_as_errors: true
  - type: "r"
    github:
    - "satijalab/azimuth@ad5929686e005ae91d8452187a3a1d8c0563fdd5"
    bioc_force_install: false
    warnings_as_errors: true
  test_setup:
  - type: "r"
    cran:
    - "testthat"
    - "processx"
    bioc_force_install: false
    warnings_as_errors: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/annotate/azimuth/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/_private/executable/annotate/azimuth"
  executable: "target/_private/executable/annotate/azimuth/azimuth"
  viash_version: "0.9.7"
  git_commit: "70212534a87e82ff211ab251108ea0ed2b769b6f"
  git_remote: "https://github.com/openpipelines-bio/openpipeline"
package_config:
  name: "openpipeline"
  summary: "Best-practice workflows for single-cell multi-omics analyses.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nIn terms of workflows, the following has been made available, but keep in mind\
    \ that\nindividual tools and functionality can be executed as standalone components\
    \ as well.\n\n  * Demultiplexing: conversion of raw sequencing data to FASTQ objects.\n\
    \  * Ingestion: Read mapping and generating a count matrix.\n  * Single sample\
    \ processing: cell filtering and doublet detection.\n  * Multisample processing:\
    \ Count transformation, normalization, QC metric calulations.\n  * Integration:\
    \ Clustering, integration and batch correction using single and multimodal methods.\n\
    \  * Downstream analysis workflows\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-data"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".version := \"integration_build\""
  - ".engines[.type == 'docker'].target_tag := 'integration_build'"
  keywords:
  - "single-cell"
  - "multimodal"
  license: "MIT"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline/issues"
