name: "pca"
namespace: "preprocessing"
version: "v0.1.3"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Input h5mu file. Genes with zero expression must be filtered out\n\
      beforehand (e.g. with `filter_genes`); rapids-singlecell PCA raises an\nerror\
      \ if any gene has zero total expression across all cells.\n"
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Use specified layer for expression values instead of the .X object\n\
      from the modality.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--var_input"
    description: "Column name in .var matrix that will be used to select which genes\n\
      to run the PCA on.\n"
    info: null
    example:
    - "filter_with_hvg"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "integer"
    name: "--num_components"
    description: "Number of principal components to compute. Defaults to 50, or\n\
      1 - minimum dimension size of selected representation.\n"
    info: null
    example:
    - 25
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--chunked"
    description: "If True, perform an incremental PCA on segments of a predefined\n\
      size. Setting this flag automatically implies zero centering.\nMust be specified\
      \ together with --chunk_size.\n"
    info: null
    direction: "input"
  - type: "integer"
    name: "--chunk_size"
    description: "Number of observations to include in each chunk. Required if\nchunked=True\
      \ was passed.\n"
    info: null
    required: false
    min: 2
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "Used to set the initial states for the optimization.\n"
    info: null
    required: false
    min: 0
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    alternatives:
    - "-o"
    description: "Output h5mu file."
    info: null
    default:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsm_output"
    description: "In which .obsm slot to store the resulting embedding."
    info: null
    default:
    - "X_pca"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--varm_output"
    description: "In which .varm slot to store the resulting loadings matrix."
    info: null
    default:
    - "pca_loadings"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--uns_output"
    description: "In which .uns slot to store the resulting variance objects."
    info: null
    default:
    - "pca_variance"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--overwrite"
    description: "Allow overwriting .obsm, .varm and .uns slots."
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata\n\
      objects. By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "compress_h5mu.py"
- type: "file"
  path: "anndata_io.py"
- type: "file"
  path: "gpu.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Computes PCA coordinates, loadings and variance decomposition.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "pbmc_1k_protein_v3"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
- type: "vsh"
  name: "openpipeline_spatial"
  repo: "openpipeline_spatial"
  tag: "v0.5.0"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
  docker_run_args:
  - "--gpus all"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midmem"
    - "lowcpu"
    - "highdisk"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "nvidia/cuda:13.1.2-runtime-ubuntu24.04"
  target_registry: "images.viash-hub.com"
  target_tag: "v0.1.3"
  namespace_separator: "/"
  setup:
  - type: "docker"
    env:
    - "PIP_BREAK_SYSTEM_PACKAGES=1"
  - type: "apt"
    packages:
    - "python3-pip"
    - "python-is-python3"
    interactive: false
  - type: "docker"
    run:
    - "pip install --upgrade --no-cache-dir --ignore-installed pip"
  - type: "docker"
    run:
    - "cat > /NOTICE <<'EOF'\nThis image contains software provided by NVIDIA Corporation\n\
      and is governed by the NVIDIA Deep Learning Container License:\nhttps://developer.download.nvidia.com/licenses/NVIDIA_Deep_Learning_Container_License.pdf\n\
      \nThe source code for this project is licensed under MIT:\nhttps://github.com/openpipelines-bio/openpipeline_rapids\n\
      EOF"
  - type: "docker"
    run:
    - "pip install --no-cache-dir --extra-index-url=https://pypi.nvidia.com \\\n \
      \ \"rapids-singlecell-cu13==0.15.0\" \\\n  \"cudf-cu13==26.04.*\" \\\n  \"cuml-cu13==26.04.*\"\
      \ \\\n  \"cugraph-cu13==26.04.*\" \\\n  \"cuvs-cu13==26.04.*\""
  - type: "python"
    user: false
    packages:
    - "mudata~=0.3.2"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.8.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/preprocessing/pca/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker|native"
  output: "target/nextflow/preprocessing/pca"
  executable: "target/nextflow/preprocessing/pca/main.nf"
  viash_version: "0.9.7"
  git_commit: "d5eea3ab1e824144259ebf28b0239f71cf3a4688"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_rapids"
package_config:
  name: "openpipeline_rapids"
  version: "v0.1.3"
  summary: "Best-practice workflows for single-cell multi-omics analyses using rapids-singlecell.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nThis repository contains GPU-enabled components using the [rapids-singlecell](https://rapids-singlecell.readthedocs.io/en/latest/)\
    \ library.\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_rapids/resources_test"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  - type: "vsh"
    name: "openpipeline_spatial"
    repo: "openpipeline_spatial"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".engines += { type: \"native\" }"
  - ".engines[.type == 'docker'].target_registry := 'images.viash-hub.com'"
  - ".engines[.type == 'docker'].target_tag := 'v0.1.3'"
  keywords:
  - "single-cell"
  - "multimodal"
  - "rapids"
  license: "MIT"
  organization: "vsh"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline_rapids/issues"
