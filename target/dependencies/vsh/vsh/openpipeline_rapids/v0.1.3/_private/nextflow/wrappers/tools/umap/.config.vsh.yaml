name: "umap"
namespace: "wrappers/tools"
version: "v0.1.3"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--uns_neighbors"
    description: "The `.uns` neighbors slot as output by the `find_neighbors` component."
    info: null
    default:
    - "neighbors"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Compute"
  description: "Options controlling which implementation of the component runs."
  arguments:
  - type: "string"
    name: "--device_type"
    description: "Which implementation to run: the GPU (rapids-singlecell) variant\
      \ or the\nCPU (scanpy/squidpy) variant of the component. Selecting `gpu` requires\
      \ a\nCUDA-capable GPU; the component errors out if none is available (there\
      \ is\nno automatic fallback to CPU)."
    info: null
    default:
    - "gpu"
    required: false
    choices:
    - "cpu"
    - "gpu"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Output h5mu file."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsm_output"
    description: "In which .obsm slot to store the resulting UMAP embedding."
    info: null
    default:
    - "X_umap"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata\n\
      objects. By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "double"
    name: "--min_dist"
    description: "The effective minimum distance between embedded points. Smaller\n\
      values will result in a more clustered/clumped embedding where\nnearby points\
      \ on the manifold are drawn closer together, while\nlarger values will result\
      \ on a more even dispersal of points. The\nvalue should be set relative to the\
      \ spread value, which determines\nthe scale at which embedded points will be\
      \ spread out.\n"
    info: null
    default:
    - 0.5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--spread"
    description: "The effective scale of embedded points. In combination with\n`min_dist`\
      \ this determines how clustered/clumped the embedded\npoints are.\n"
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--num_components"
    description: "The number of dimensions of the embedding."
    info: null
    default:
    - 2
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_iter"
    description: "The number of iterations (epochs) of the optimization. Called\n\
      `n_epochs` in the original UMAP.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--alpha"
    description: "The initial learning rate for the embedding optimization."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--negative_sample_rate"
    description: "The number of negative edge/1-simplex samples to use per positive\n\
      edge/1-simplex sample in optimizing the low dimensional embedding.\n"
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--init_pos"
    description: "How to initialize the low dimensional embedding. Called `init` in\n\
      the original UMAP. Options are:\n\n* `'auto'`: chooses `'spectral'` for n_samples\
      \ < 1000000, `'random'` otherwise.\n* `'spectral'`: use a spectral embedding\
      \ of the graph.\n* `'random'`: assign initial embedding positions at random.\n\
      * `'paga'`: use the paga() layout as initial embedding positions.\n* Any key\
      \ from `.obsm`.\n"
    info: null
    default:
    - "spectral"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "rapids-singlecell options"
  description: "Exposed only by the GPU (rapids-singlecell) variant (--device_type\
    \ gpu)."
  arguments:
  - type: "integer"
    name: "--random_state"
    description: "Seed used by the random number generator."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Scanpy options"
  description: "Exposed only by the CPU (scanpy) variant (--device_type cpu)."
  arguments:
  - type: "double"
    name: "--gamma"
    description: "Weighting applied to negative samples in low dimensional embedding\n\
      optimization. Values higher than one will result in greater weight\nbeing given\
      \ to negative samples.\n"
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "UMAP (Uniform Manifold Approximation and Projection), running either\
  \ the GPU\n(rapids-singlecell) or the CPU (scanpy/squidpy) variant, selected with\
  \ --device_type.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "pbmc_1k_protein_v3"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
dependencies:
- name: "tools/umap"
  alias: "umap_gpu"
  repository:
    type: "local"
- name: "dimred/umap"
  alias: "umap_cpu"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
- type: "vsh"
  name: "openpipeline_spatial"
  repo: "openpipeline_spatial"
  tag: "v0.5.0"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "native"
  id: "native"
build_info:
  config: "src/wrappers/tools/umap/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/_private/nextflow/wrappers/tools/umap"
  executable: "target/_private/nextflow/wrappers/tools/umap/main.nf"
  viash_version: "0.9.7"
  git_commit: "d5eea3ab1e824144259ebf28b0239f71cf3a4688"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_rapids"
  dependencies:
  - "target/nextflow/tools/umap"
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.0/nextflow/dimred/umap"
package_config:
  name: "openpipeline_rapids"
  version: "v0.1.3"
  summary: "Best-practice workflows for single-cell multi-omics analyses using rapids-singlecell.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nThis repository contains GPU-enabled components using the [rapids-singlecell](https://rapids-singlecell.readthedocs.io/en/latest/)\
    \ library.\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_rapids/resources_test"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  - type: "vsh"
    name: "openpipeline_spatial"
    repo: "openpipeline_spatial"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".engines += { type: \"native\" }"
  - ".engines[.type == 'docker'].target_registry := 'images.viash-hub.com'"
  - ".engines[.type == 'docker'].target_tag := 'v0.1.3'"
  keywords:
  - "single-cell"
  - "multimodal"
  - "rapids"
  license: "MIT"
  organization: "vsh"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline_rapids/issues"
