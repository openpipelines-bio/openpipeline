name: "neighbors"
namespace: "wrappers/preprocessing"
version: "v0.1.3"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsm_input"
    description: "Which .obsm slot to use as a starting embedding (use_rep)."
    info: null
    default:
    - "X_pca"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Compute"
  description: "Options controlling which implementation of the component runs."
  arguments:
  - type: "string"
    name: "--device_type"
    description: "Which implementation to run: the GPU (rapids-singlecell) variant\
      \ or the\nCPU (scanpy/squidpy) variant of the component. Selecting `gpu` requires\
      \ a\nCUDA-capable GPU; the component errors out if none is available (there\
      \ is\nno automatic fallback to CPU)."
    info: null
    default:
    - "gpu"
    required: false
    choices:
    - "cpu"
    - "gpu"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Output h5mu file containing the found neighbors."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--uns_output"
    description: "In which .uns slot to store the neighbor graph metadata."
    info: null
    default:
    - "neighbors"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsp_distances"
    description: "In which .obsp slot to store the distance matrix between the resulting\
      \ neighbors."
    info: null
    default:
    - "distances"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsp_connectivities"
    description: "In which .obsp slot to store the connectivities matrix between the\
      \ resulting neighbors."
    info: null
    default:
    - "connectivities"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata\n\
      objects. By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "integer"
    name: "--num_neighbors"
    description: "The size of the local neighborhood (in terms of number of\nneighboring\
      \ data points) used for manifold approximation. Larger\nvalues result in more\
      \ global views of the manifold, while smaller\nvalues result in more local data\
      \ being preserved. In general\nvalues should be in the range 2 to 100.\n"
    info: null
    default:
    - 15
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--metric"
    description: "The distance metric to use. Restricted to the metrics supported\
      \ by\nboth the CPU (scanpy) and GPU (rapids-singlecell) backends, so the\nvalue\
      \ is valid regardless of --device_type. Each backend supports\nfurther metrics\
      \ on its own, but only this common set is exposed here\nto keep the two variants\
      \ interchangeable.\n"
    info: null
    default:
    - "euclidean"
    required: false
    choices:
    - "euclidean"
    - "l1"
    - "l2"
    - "manhattan"
    - "cityblock"
    - "cosine"
    - "correlation"
    - "chebyshev"
    - "canberra"
    - "minkowski"
    - "sqeuclidean"
    - "jaccard"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "A random seed."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "rapids-singlecell options"
  description: "Exposed only by the GPU (rapids-singlecell) variant (--device_type\
    \ gpu)."
  arguments:
  - type: "integer"
    name: "--n_pcs"
    description: "Number of dimensions of the `--obsm_input` representation to use.\
      \ If\nnot set, all available dimensions are used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--algorithm"
    description: "The KNN query algorithm to use (provided by cuVS).\nSee https://docs.rapids.ai/api/cuvs/stable/\
      \ for details.\n"
    info: null
    default:
    - "brute"
    required: false
    choices:
    - "brute"
    - "cagra"
    - "ivfflat"
    - "ivfpq"
    - "nn_descent"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--method"
    description: "Method for computing connectivities. 'umap' uses\nthe UMAP fuzzy\
      \ simplicial set, 'gauss' uses an adaptive Gaussian\nkernel, 'jaccard' uses\
      \ the PhenoGraph Jaccard index.\n"
    info: null
    default:
    - "umap"
    required: false
    choices:
    - "umap"
    - "gauss"
    - "jaccard"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Compute a nearest-neighbor graph of observations, running either the\
  \ GPU\n(rapids-singlecell) or the CPU (scanpy) variant of neighbors, selected\n\
  with --device_type.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "pbmc_1k_protein_v3"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
dependencies:
- name: "preprocessing/neighbors"
  alias: "neighbors_gpu"
  repository:
    type: "local"
- name: "neighbors/find_neighbors"
  alias: "neighbors_cpu"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
- type: "vsh"
  name: "openpipeline_spatial"
  repo: "openpipeline_spatial"
  tag: "v0.5.0"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "native"
  id: "native"
build_info:
  config: "src/wrappers/preprocessing/neighbors/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/_private/nextflow/wrappers/preprocessing/neighbors"
  executable: "target/_private/nextflow/wrappers/preprocessing/neighbors/main.nf"
  viash_version: "0.9.7"
  git_commit: "d5eea3ab1e824144259ebf28b0239f71cf3a4688"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_rapids"
  dependencies:
  - "target/nextflow/preprocessing/neighbors"
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.0/nextflow/neighbors/find_neighbors"
package_config:
  name: "openpipeline_rapids"
  version: "v0.1.3"
  summary: "Best-practice workflows for single-cell multi-omics analyses using rapids-singlecell.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nThis repository contains GPU-enabled components using the [rapids-singlecell](https://rapids-singlecell.readthedocs.io/en/latest/)\
    \ library.\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_rapids/resources_test"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  - type: "vsh"
    name: "openpipeline_spatial"
    repo: "openpipeline_spatial"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".engines += { type: \"native\" }"
  - ".engines[.type == 'docker'].target_registry := 'images.viash-hub.com'"
  - ".engines[.type == 'docker'].target_tag := 'v0.1.3'"
  keywords:
  - "single-cell"
  - "multimodal"
  - "rapids"
  license: "MIT"
  organization: "vsh"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline_rapids/issues"
