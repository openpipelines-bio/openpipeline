name: "highly_variable_genes"
namespace: "wrappers/preprocessing"
version: "v0.1.3"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_layer"
    description: "Input layer to use for expression values. By default, X is used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Compute"
  description: "Options controlling which implementation of the component runs."
  arguments:
  - type: "string"
    name: "--device_type"
    description: "Which implementation to run: the GPU (rapids-singlecell) variant\
      \ or the\nCPU (scanpy/squidpy) variant of the component. Selecting `gpu` requires\
      \ a\nCUDA-capable GPU; the component errors out if none is available (there\
      \ is\nno automatic fallback to CPU)."
    info: null
    default:
    - "gpu"
    required: false
    choices:
    - "cpu"
    - "gpu"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Output h5mu file."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--var_name_filter"
    description: "In which .var slot to store a boolean array indicating which features\n\
      are highly variable.\n"
    info: null
    default:
    - "highly_variable"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--varm_name"
    description: "In which .varm slot to store the per-gene HVG metrics.\n"
    info: null
    default:
    - "hvg"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata\n\
      objects. By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "string"
    name: "--flavor"
    description: "Choose the flavor for identifying highly variable genes. For the\n\
      dispersion-based methods in their default workflows, Seurat passes\nthe cutoffs\
      \ whereas Cell Ranger passes n_top_features. The\n'seurat_v3_paper', 'pearson_residuals'\
      \ and 'poisson_gene_selection'\nflavors are only available on the GPU (rapids-singlecell)\
      \ variant.\n"
    info: null
    default:
    - "seurat"
    required: false
    choices:
    - "seurat"
    - "cell_ranger"
    - "seurat_v3"
    - "seurat_v3_paper"
    - "pearson_residuals"
    - "poisson_gene_selection"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_top_features"
    description: "Number of highly-variable features to keep. Mandatory if flavor\
      \ is\n'seurat_v3', 'seurat_v3_paper', 'pearson_residuals' or\n'poisson_gene_selection'.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--min_mean"
    description: "If n_top_features is defined, this and all other cutoffs for the\n\
      means and the normalized dispersions are ignored. Only used for\ndispersion-based\
      \ flavors.\n"
    info: null
    default:
    - 0.0125
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--max_mean"
    description: "If n_top_features is defined, this and all other cutoffs for the\n\
      means and the normalized dispersions are ignored. Only used for\ndispersion-based\
      \ flavors.\n"
    info: null
    default:
    - 3.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--min_disp"
    description: "If n_top_features is defined, this and all other cutoffs for the\n\
      means and the normalized dispersions are ignored. Only used for\ndispersion-based\
      \ flavors.\n"
    info: null
    default:
    - 0.5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--max_disp"
    description: "If n_top_features is defined, this and all other cutoffs for the\n\
      means and the normalized dispersions are ignored. Only used for\ndispersion-based\
      \ flavors. Default is +inf.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--span"
    description: "The fraction of the data (cells) used when estimating the variance\n\
      in the loess model fit if flavor is 'seurat_v3' or 'seurat_v3_paper'.\n"
    info: null
    default:
    - 0.3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_bins"
    description: "Number of bins for binning the mean gene expression. Normalization\
      \ is\ndone with respect to each bin. If just a single gene falls into a\nbin,\
      \ the normalized dispersion is artificially set to 1.\n"
    info: null
    default:
    - 20
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_batch_key"
    description: "If specified, highly-variable features are selected within each\n\
      batch separately and merged.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "rapids-singlecell options"
  description: "Exposed only by the GPU (rapids-singlecell) variant (--device_type\
    \ gpu)."
  arguments:
  - type: "integer"
    name: "--theta"
    description: "The negative binomial overdispersion parameter for Pearson residuals.\n\
      Higher values correspond to less overdispersion. Only used if flavor\nis 'pearson_residuals'.\n"
    info: null
    default:
    - 100
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--clip"
    description: "Determines if and how Pearson residuals are clipped. If unset,\n\
      residuals are clipped to [-sqrt(n_obs), sqrt(n_obs)]. If a scalar c is\ngiven,\
      \ residuals are clipped to [-c, c]. Only used if flavor is\n'pearson_residuals'.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--chunksize"
    description: "If flavor is 'poisson_gene_selection', this determines how many\
      \ genes\nare processed at once. Choosing a smaller value will reduce the\nrequired\
      \ memory.\n"
    info: null
    default:
    - 1000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_samples"
    description: "The number of Binomial samples used to estimate the posterior\n\
      probability of enrichment of zeros for each gene. Only used if flavor\nis 'poisson_gene_selection'.\n"
    info: null
    default:
    - 10000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--check_values"
    description: "Check if counts in the selected layer are integers. A warning is\n\
      emitted otherwise. Only used if flavor is 'seurat_v3',\n'seurat_v3_paper', 'pearson_residuals'\
      \ or 'poisson_gene_selection'.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Scanpy options"
  description: "Exposed only by the CPU (scanpy) variant (--device_type cpu)."
  arguments:
  - type: "string"
    name: "--var_input"
    description: "If specified, use boolean array in adata.var[var_input] to calculate\n\
      hvg on subset of vars.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--features_to_exclude"
    description: "User-defined list of feature names to exclude before HVG calculation.\n\
      These features will be excluded from HVG selection but will remain in\nthe output\
      \ data.\n"
    info: null
    example:
    - "MT-CO1"
    - "MT-CO2"
    - "MT-ND1"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Annotate highly variable genes, running either the GPU (rapids-singlecell)\
  \ or\nthe CPU (scanpy) variant of highly_variable_genes, selected with --device_type.\n\
  \nExpects log-normalized data for the default 'seurat' flavor. The GPU variant\n\
  exposes additional flavors ('seurat_v3_paper', 'pearson_residuals',\n'poisson_gene_selection')\
  \ that the CPU variant does not support.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "pbmc_1k_protein_v3"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
dependencies:
- name: "preprocessing/highly_variable_genes"
  alias: "highly_variable_genes_gpu"
  repository:
    type: "local"
- name: "feature_annotation/highly_variable_features_scanpy"
  alias: "highly_variable_genes_cpu"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
- type: "vsh"
  name: "openpipeline_spatial"
  repo: "openpipeline_spatial"
  tag: "v0.5.0"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "native"
  id: "native"
build_info:
  config: "src/wrappers/preprocessing/highly_variable_genes/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/_private/nextflow/wrappers/preprocessing/highly_variable_genes"
  executable: "target/_private/nextflow/wrappers/preprocessing/highly_variable_genes/main.nf"
  viash_version: "0.9.7"
  git_commit: "d5eea3ab1e824144259ebf28b0239f71cf3a4688"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_rapids"
  dependencies:
  - "target/nextflow/preprocessing/highly_variable_genes"
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.0/nextflow/feature_annotation/highly_variable_features_scanpy"
package_config:
  name: "openpipeline_rapids"
  version: "v0.1.3"
  summary: "Best-practice workflows for single-cell multi-omics analyses using rapids-singlecell.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nThis repository contains GPU-enabled components using the [rapids-singlecell](https://rapids-singlecell.readthedocs.io/en/latest/)\
    \ library.\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_rapids/resources_test"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  - type: "vsh"
    name: "openpipeline_spatial"
    repo: "openpipeline_spatial"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".engines += { type: \"native\" }"
  - ".engines[.type == 'docker'].target_registry := 'images.viash-hub.com'"
  - ".engines[.type == 'docker'].target_tag := 'v0.1.3'"
  keywords:
  - "single-cell"
  - "multimodal"
  - "rapids"
  license: "MIT"
  organization: "vsh"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline_rapids/issues"
