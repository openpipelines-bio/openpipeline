name: "copy_modality_slots"
namespace: "metadata"
version: "main_build"
authors:
- name: "Luke Zappia"
  roles:
  - "author"
  info:
    links:
      github: "lazappi"
      orcid: "0000-0001-7744-8565"
      linkedin: "lazappi"
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    links:
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
argument_groups:
- name: "Inputs"
  description: "Arguments related to the input dataset, which is copied into."
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "The input data to copy slots into. Should be a .h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality to copy slots into."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Source"
  description: "Arguments related to the source dataset, which is copied from."
  arguments:
  - type: "file"
    name: "--source"
    description: "The source data to copy slots from. Should be a .h5mu file."
    info: null
    example:
    - "source.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--source_modality"
    description: "Which modality in the source data to copy slots from. Defaults to\n\
      the value of --modality.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--source_var_gene_names"
    description: "The name of the .var column in the source data containing gene names\n\
      to match against the input .var index; when not provided, the source\n.var index\
      \ is used. Useful when an upstream step has rewritten the\nsource .var index\
      \ (e.g. by sanitising gene names) and the original,\ninput-compatible names\
      \ are preserved in a column.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Slots to copy"
  description: "Items to copy from the source modality into the input modality. Each\n\
    argument restricts the copy to the named items. If an argument is not\nspecified,\
    \ every item present in the source modality but missing from\nthe input modality\
    \ is copied for that slot.\n"
  arguments:
  - type: "string"
    name: "--obs"
    description: ".obs columns to copy. If not specified, all .obs columns present\
      \ in\nthe source but missing from the input are copied.\n"
    info: null
    example:
    - "obs1"
    - "obs2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--var"
    description: ".var columns to copy. If not specified, all .var columns present\
      \ in\nthe source but missing from the input are copied.\n"
    info: null
    example:
    - "var1"
    - "var2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--layers"
    description: ".layers keys to copy. If not specified, all .layers keys present\
      \ in\nthe source but missing from the input are copied.\n"
    info: null
    example:
    - "layer1"
    - "layer2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--obsm"
    description: ".obsm keys to copy. If not specified, all .obsm keys present in\
      \ the\nsource but missing from the input are copied.\n"
    info: null
    example:
    - "obsm1"
    - "obsm2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--varm"
    description: ".varm keys to copy. If not specified, all .varm keys present in\
      \ the\nsource but missing from the input are copied.\n"
    info: null
    example:
    - "varm1"
    - "varm2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--obsp"
    description: ".obsp keys to copy. If not specified, all .obsp keys present in\
      \ the\nsource but missing from the input are copied.\n"
    info: null
    example:
    - "obsp1"
    - "obsp2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--varp"
    description: ".varp keys to copy. If not specified, all .varp keys present in\
      \ the\nsource but missing from the input are copied.\n"
    info: null
    example:
    - "varp1"
    - "varp2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--uns"
    description: ".uns keys to copy. If not specified, all .uns keys present in the\n\
      source but missing from the input are copied.\n"
    info: null
    example:
    - "uns1"
    - "uns2"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "boolean_true"
    name: "--allow_overwrite"
    description: "Allow overwriting keys that already exist in the input modality.\n\
      By default the component raises an error if a key already exists;\nwhen enabled,\
      \ existing keys are overwritten with a warning.\n"
    info: null
    direction: "input"
  - type: "boolean_true"
    name: "--allow_partial"
    description: "Allow the source's .obs/.var indices to be a strict subset of the\n\
      input's. Rows or columns of the input that are not represented in\nthe source\
      \ are filled with missing values (NaN for numeric data;\nappropriate sentinel\
      \ for DataFrame columns). By default the two\nindex sets must be equal.\n"
    info: null
    direction: "input"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    alternatives:
    - "-o"
    description: "Output h5mu file (the input with slots copied from the source)."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata H5\
      \ files.\nBy default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "compress_h5mu.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
label: "Copy modality slots"
description: "Copy items (.obs, .var, .layers, .obsm, .varm, .obsp, .varp, .uns) from\
  \ a\nmodality in a source MuData file into a modality in the input MuData file.\n\
  \nBy default the source and input modalities must have identical .obs and\n.var\
  \ index sets (ordering may differ; source is reindexed to match the\ninput). With\
  \ --allow_partial, the source's .obs/.var indices may be a\nstrict subset of the\
  \ input's; rows or columns of the input that are not\nrepresented in the source\
  \ are filled with NaN for numeric slots and with\nthe appropriate missing-value\
  \ sentinel for DataFrame columns.\n\nExisting keys in the input are not overwritten\
  \ by default. Use\n--allow_overwrite to allow overwriting (a warning is emitted\
  \ for each\noverwritten key).\n\nEach slot argument restricts the copy to the named\
  \ items. If a slot\nargument is not specified, every item present in the source\
  \ modality but\nmissing from the input modality is copied for that slot.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "singlecpu"
    - "midmem"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.13-slim"
  target_tag: "main_build"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "anndata~=0.12.16"
    - "awkward"
    - "scipy~=1.17.1"
    - "mudata~=0.3.8"
    script:
    - "exec(\"try:\\n  import zarr; from importlib.metadata import version\\nexcept\
      \ ModuleNotFoundError:\\n  exit(0)\\nelse:  assert int(version(\\\"zarr\\\"\
      ).partition(\\\".\\\")[0]) > 2\")"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.10.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/metadata/copy_modality_slots/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/executable/metadata/copy_modality_slots"
  executable: "target/executable/metadata/copy_modality_slots/copy_modality_slots"
  viash_version: "0.9.7"
  git_commit: "9a5bf1fbfb4db82e6625dbee2692b6d8bc1a278c"
  git_remote: "https://github.com/openpipelines-bio/openpipeline"
package_config:
  name: "openpipeline"
  summary: "Best-practice workflows for single-cell multi-omics analyses.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nIn terms of workflows, the following has been made available, but keep in mind\
    \ that\nindividual tools and functionality can be executed as standalone components\
    \ as well.\n\n  * Demultiplexing: conversion of raw sequencing data to FASTQ objects.\n\
    \  * Ingestion: Read mapping and generating a count matrix.\n  * Single sample\
    \ processing: cell filtering and doublet detection.\n  * Multisample processing:\
    \ Count transformation, normalization, QC metric calulations.\n  * Integration:\
    \ Clustering, integration and batch correction using single and multimodal methods.\n\
    \  * Downstream analysis workflows\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-data"
      dest: "resources_test"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  - ".version := \"main_build\""
  - ".engines[.type == 'docker'].target_tag := 'main_build'"
  keywords:
  - "single-cell"
  - "multimodal"
  license: "MIT"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline/issues"
