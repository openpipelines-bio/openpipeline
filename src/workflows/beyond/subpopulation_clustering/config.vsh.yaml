name: "subpopulation_clustering"
namespace: "workflows/beyond"
scope: "public"
description: |
  Splits an annotated atlas by cell type (`--obs_cell_type`), clusters each cell type
  separately and merges the result back, so that every cell carries a within-cell-type
  subpopulation label in `obs[--obs_label]`.

  Expects a processed, integrated and annotated atlas, e.g. from the
  `workflows/multiomics/process_samples`, `workflows/integration/harmony_leiden` and
  `workflows/annotation/celltypist` workflows.

authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        description: |
          Annotated atlas h5mu: one object with a broad cell-type label in
          `obs[--obs_cell_type]`.
        example: atlas.h5mu

      - name: "--obs_cell_type"
        type: string
        default: "celltypist_pred"
        required: false
        description: .obs column holding the broad cell-type label to split on.

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Atlas h5mu with the subpopulation labels added.
        example: atlas_with_subpopulations.h5mu

      - name: "--obs_label"
        type: string
        default: "subpopulation"
        required: false
        description: |
          .obs column for the per-cell-type Leiden labels. This is the `--obs_label`
          input of `stats/calculate_label_proportions`.

  - name: Clustering
    arguments:
      - name: "--leiden_resolution"
        type: double
        multiple: true
        default: [0.5]
        required: false
        description: Leiden resolution(s) used within each cell type.

dependencies:
  - name: dataflow/split_h5mu
  - name: dimred/pca
  - name: workflows/multiomics/neighbors_leiden_umap
  - name: dataflow/concatenate_h5mu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/beyond_test_data

runners:
  - type: nextflow
