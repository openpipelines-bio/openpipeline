name: "subpopulation_clustering"
namespace: "workflows/beyond"
scope: "public"
description: |
  Splits an annotated atlas by broad cell type and clusters each cell type separately, so
  that every cell carries a within-cell-type subpopulation label.

  This is the one step of the BEYOND atlas preparation that existing OpenPipeline workflows
  do not cover. Everything before it is already available:

    1. `workflows/multiomics/process_samples`   -  per-sample QC, filtering, doublet
       detection, concatenation, normalisation and HVF selection
    2. `workflows/integration/harmony_leiden`   -  integration, neighbours, Leiden, UMAP
    3. `workflows/annotation/celltypist`        -  broad cell-type labels

  Run those first, then this workflow, then `workflows/beyond/trajectory_analysis`.

  Steps:
    1. `dataflow/split_h5mu` on `--obs_cell_type`
    2. per cell type: `dimred/pca` -> `workflows/multiomics/neighbors_leiden_umap`
       (Leiden labels written to `--obs_label`)
    3. `dataflow/concatenate_h5mu` back into one object

  Output: the same atlas with `obs[--obs_label]` added, which is the label input of
  `stats/calculate_label_proportions` and therefore of the whole BEYOND trajectory workflow.

authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        description: |
          Annotated atlas h5mu: one object with a broad cell-type label in
          `obs[--obs_cell_type]`.
        example: atlas.h5mu

      - name: "--obs_cell_type"
        type: string
        default: "celltypist_pred"
        required: false
        description: .obs column holding the broad cell-type label to split on.

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Atlas h5mu with the subpopulation labels added.
        example: atlas_with_subpopulations.h5mu

      - name: "--obs_label"
        type: string
        default: "subpopulation"
        required: false
        description: |
          .obs column for the per-cell-type Leiden labels. This is the `--obs_label`
          input of `stats/calculate_label_proportions`.

  - name: Clustering
    arguments:
      - name: "--leiden_resolution"
        type: double
        multiple: true
        default: [0.5]
        required: false
        description: Leiden resolution(s) used within each cell type.

dependencies:
  - name: dataflow/split_h5mu
  - name: dimred/pca
  - name: workflows/multiomics/neighbors_leiden_umap
  - name: dataflow/concatenate_h5mu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/beyond_test_data

runners:
  - type: nextflow
