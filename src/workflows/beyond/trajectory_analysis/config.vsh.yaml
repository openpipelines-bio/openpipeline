name: "trajectory_analysis"
namespace: "workflows/beyond"
scope: "public"
description: |
  BEYOND trajectory analysis of a multi-donor atlas with subpopulation labels.
  Computes the donor x subpopulation proportions, places the donors on a PHATE
  landscape, orders them along a Palantir pseudotime, fits how each subpopulation
  changes along it, groups subpopulations into communities, and tests the
  subpopulations for association with donor traits.

references:
  doi:
    # BEYOND methodology
    - 10.1038/s41586-024-07871-6
    # PsychAD RADC_Cohort, the real cohort the test fixture is built from. Distributed
    # by CZ CELLxGENE Discover under CC-BY 4.0, which requires attribution:
    # https://cellxgene.cziscience.com/collections/84ce6837-548d-4a1f-919f-0bc0d9a3952f
    - 10.1101/2024.10.31.24316513

authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        description: |
          Atlas h5mu file with the donor (`--obs_group`) and subpopulation
          (`--obs_label`) columns in `.obs`, e.g. the output of
          `workflows/beyond/subpopulation_clustering`.
        example: atlas.h5mu
      - name: "--obs_group"
        type: string
        default: "participant_id"
        required: false
        description: |
          .obs column that groups the cells for proportion calculation (a participant /
          donor / sample identifier), e.g. the column written by metadata/add_id.
          It also names the identifier column of every table this workflow writes.
      - name: "--obs_label"
        type: string
        default: "subpopulation"
        required: false
        description: |
          .obs column with the cell labels whose proportions are computed, e.g. the
          subpopulation labels from beyond/subpopulation_clustering.
      - name: "--obs_normalize_within"
        type: string
        required: false
        description: |
          .obs column with the cell type that --obs_label subdivides. When given,
          subpopulation proportions are computed within cell type instead of over all
          of a donor's cells.
        example: "cell_class"

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: |
          Atlas h5mu with the participant x subpopulation proportion matrix added to
          uns[--uns_proportions]. The cells are otherwise unchanged.
        example: beyond_atlas.h5mu

      - name: "--uns_proportions"
        type: string
        default: "proportions"
        required: false
        description: |
          .uns key under which the proportion matrix is kept in --output.

      - name: "--output_proportions_csv"
        type: file
        required: false
        direction: output
        description: Participant x subpopulation proportion table.
        example: proportions.csv

      - name: "--output_phate_csv"
        type: file
        required: false
        direction: output
        description: PHATE coordinates of the cellular landscape, one row per participant.
        example: phate.csv

      - name: "--output_pseudotime_csv"
        type: file
        required: false
        direction: output
        description: |
          Palantir pseudotime, entropy and fate probabilities, one row per participant.
        example: pseudotime.csv

      - name: "--output_dynamics_csv"
        type: file
        required: false
        direction: output
        description: |
          Long-format fitted proportion curves, one row per
          (subpopulation, pseudotime bin).
        example: dynamics.csv

      - name: "--output_dynamics_stats_csv"
        type: file
        required: false
        direction: output
        description: |
          Per-subpopulation dynamics statistics: peak pseudotime, R^2 and p-value.
        example: dynamics_stats.csv

      - name: "--output_communities_csv"
        type: file
        required: false
        direction: output
        description: Subpopulation -> community assignment.
        example: communities.csv

      - name: "--output_trait_associations_csv"
        type: file
        required: false
        direction: output
        description: |
          Long-format CSV of the association results, one row per
          (subpopulation, trait, term). Written by stats/test_associations.
        example: trait_associations.csv

  - name: Cellular landscape  -  PHATE
    arguments:
      - name: "--phate_n_components"
        type: integer
        default: 3
        required: false
        description: |
          Number of PHATE dimensions. The reference implementation uses 3 for the full
          cohort and 2 for the core-donor landscape.
      - name: "--phate_knn"
        type: integer
        default: 10
        required: false
        description: Number of nearest neighbours for the PHATE kernel.
      - name: "--phate_decay"
        type: integer
        default: 40
        required: false
        description: PHATE alpha-decay rate.

  - name: Trajectory  -  Palantir
    arguments:
      - name: "--start_id"
        type: string
        required: false
        description: |
          Identifier of the participant to use as the trajectory root.
          Mutually exclusive with --start_cluster.
        example: "Donor_135"
      - name: "--start_cluster"
        type: string
        required: false
        description: |
          Value of --start_cluster_column identifying the root population of
          participants; Palantir picks the best representative automatically.
          Requires --traits_csv to carry --start_cluster_column.
        example: "No"
      - name: "--start_cluster_column"
        type: string
        required: false
        description: |
          Column of --traits_csv used with --start_cluster to find the root,
          e.g. a diagnosis column whose control level marks the start of the
          trajectory.
        example: "AD_status"
      - name: "--terminal_states"
        type: string
        multiple: true
        required: false
        description: |
          Identifiers of the participants to pin as trajectory endpoints. If neither
          this nor --terminal_states_column is given, Palantir detects them itself.
        example: ["Donor_1007", "Donor_1024"]
      - name: "--terminal_states_column"
        type: string
        required: false
        description: |
          Column of --traits_csv whose unique values mark terminal-state populations.
          Mutually exclusive with --terminal_states.
      - name: "--num_waypoints"
        type: integer
        default: 500
        required: false
        description: |
          Number of waypoints for Palantir. Must be smaller than the number of
          participants; reduce it for small cohorts.
      - name: "--palantir_n_components"
        type: integer
        default: 10
        required: false
        description: Number of diffusion-map components. Reduce for small cohorts.
      - name: "--palantir_knn"
        type: integer
        default: 30
        required: false
        description: k-nearest neighbours for the Palantir diffusion map. Reduce for small cohorts.
      - name: "--palantir_waypoint_knn"
        type: integer
        default: 30
        required: false
        description: |
          k-nearest neighbours for the Palantir waypoint graph. Must be smaller than
          --num_waypoints and than the number of participants; the BEYOND reference
          implementation uses 15.
      - name: "--pseudotime_column"
        type: string
        default: "palantir_pseudotime"
        required: false
        description: |
          Name of the pseudotime column written by Palantir and read by
          fit_proportion_dynamics.

  - name: Pseudotime dynamics
    arguments:
      - name: "--dynamics_lam"
        type: double
        default: 0.6
        required: false
        description: Smoothing regularisation penalty for the spline (higher = smoother).

  - name: Label communities
    arguments:
      - name: "--n_communities"
        type: integer
        required: true
        min: 2
        description: Number of subpopulation communities.
        example: 6
      - name: "--communities_alpha"
        type: double
        default: 0.5
        required: false
        description: |
          Weight for co-occurrence similarity (vs. dynamics similarity).
          0.0 = dynamics only; 1.0 = co-occurrence only.
      - name: "--communities_correlation_method"
        type: string
        default: "spearman"
        choices: [pearson, spearman]
        required: false
        description: Correlation used for the co-occurrence similarity.
      - name: "--communities_method"
        type: string
        default: "hierarchical"
        choices: [hierarchical, spectral]
        required: false
        description: Clustering method for community detection.

  - name: Trait associations
    arguments:
      - name: "--traits_csv"
        type: file
        required: true
        description: |
          CSV file with participant metadata. Must contain a participant ID column
          (--obs_group) and at least one trait column (--trait_columns). It is also
          the label source for --start_cluster_column / --terminal_states_column.
        example: traits.csv
      - name: "--trait_columns"
        type: string
        multiple: true
        required: true
        description: |
          Trait column(s) in the traits CSV to test for association. Each
          subpopulation proportion is modelled as `proportion ~ trait + covariates`.
          The BEYOND reference fits the reverse, `trait ~ proportion + covariates`;
          with OLS both give the same t statistic and p-value, the coefficients
          differ.
        example: ["diagnosis", "amyloid_score"]
      - name: "--covariate_columns"
        type: string
        multiple: true
        required: false
        description: Covariate column(s) in the traits CSV to include as fixed effects.
        example: ["age", "sex"]
      - name: "--random_effect_column"
        type: string
        required: false
        description: Column in the traits CSV to use as a random-effects grouping variable.
        example: "cohort"
      - name: "--proportion_transform"
        type: string
        default: "none"
        choices: [none, logit, clr, sqrt]
        required: false
        description: |
          Transformation applied to the proportions before the association models.
          Proportions are compositional, so `clr` (centered log-ratio over the
          subpopulations of a participant) or `logit` are usually more appropriate
          than the raw values.
      - name: "--fdr_method"
        type: string
        default: "bh"
        choices: [bh, bonferroni, none]
        required: false
        description: Multiple-testing correction applied to the association p-values.
      - name: "--fdr_scope"
        type: string
        default: "per_predictor"
        choices: [global, per_predictor, per_response]
        required: false
        description: |
          Set of tests the correction is applied over: all (subpopulation, trait)
          pairs at once, within each trait (the default, as in the BEYOND reference
          implementation), or within each subpopulation.

dependencies:
  - name: stats/calculate_label_proportions
  - name: dimred/phate
  - name: trajectory/palantir
  - name: trajectory/fit_proportion_dynamics
  - name: cluster/label_communities
  - name: stats/test_associations

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/beyond_test_data
  - path: /resources_test/beyond_simulated_test_data

runners:
  - type: nextflow
