name: "trajectory_analysis"
namespace: "workflows/beyond"
scope: "public"
description: |
  BEYOND trajectory analysis: takes a multi-donor atlas h5mu with broad cell-type labels
  and within-cell-type subpopulation labels (see beyond/subpopulation_clustering) and
  produces the full BEYOND outputs:

    1. stats/calculate_label_proportions      -  participant x subpopulation proportion matrix
    2. dimred/phate                        -  PHATE cellular landscape from proportion matrix
    3. trajectory/palantir                 -  pseudotime + fate probabilities
    4. trajectory/fit_proportion_dynamics  -  spline-fitted proportion dynamics along pseudotime
    5. cluster/label_communities           -  community detection (co-occurrence + dynamics)
    6. stats/test_associations             -  linear / mixed models per subpopulation x trait
    7. interpret/gseapy                    -  GSEA/ORA on DE results (optional)

  Required obs columns in the input atlas:
    obs["participant_id"]    -  donor of origin
    obs["subpopulation"]     -  per-cell-type subpopulation label
                                (from beyond/subpopulation_clustering)

authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        description: |
          Atlas h5mu file with obs["participant_id"] and obs["subpopulation"].
          Typically the output of beyond/subpopulation_clustering.
        example: atlas.h5mu

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu with all BEYOND annotations added.
        example: beyond_atlas.h5mu

      - name: "--output_trait_associations_csv"
        type: file
        required: false
        direction: output
        description: |
          Optional long-format CSV of the association results, one row per
          (subpopulation, trait, term). Written by stats/test_associations.
        example: trait_associations.csv

      - name: "--output_pathway_csv"
        type: file
        required: false
        direction: output
        description: |
          Long-format CSV with the enrichment results of every gene set library.
          Only written when --de_results_csv is provided.
        example: pathway_enrichment.csv

  - name: Atlas metadata
    arguments:
      - name: "--obs_group"
        type: string
        default: "participant_id"
        required: false
        description: |
          .obs column that groups the cells for proportion calculation (a participant /
          donor / sample identifier), e.g. the column written by metadata/add_id.
      - name: "--obs_label"
        type: string
        default: "subpopulation"
        required: false
        description: |
          .obs column with the cell labels whose proportions are computed, e.g. the
          subpopulation labels from beyond/subpopulation_clustering.

  - name: Proportions
    arguments:
      - name: "--uns_proportions"
        type: string
        default: "proportions"
        required: false
        description: |
          .uns / .obsm key under which the participant x subpopulation proportion
          matrix is stored (written by calculate_label_proportions; read by phate,
          fit_proportion_dynamics and label_communities).

  - name: Trajectory  -  Palantir
    arguments:
      - name: "--start_cell"
        type: string
        required: false
        description: |
          Exact cell barcode to use as the Palantir trajectory root.
          Required unless --start_cell_cluster is provided.
        example: "ACGTACGT-1"
      - name: "--start_cell_cluster"
        type: string
        required: false
        description: |
          Cluster label identifying the start-cell population. Palantir selects
          the best representative cell in this cluster automatically.
          Requires --start_cell_obs_key.
        example: "ExN.0"
      - name: "--start_cell_obs_key"
        type: string
        default: "subpopulation"
        required: false
        description: .obs column used with --start_cell_cluster to find the start cell.
      - name: "--terminal_states_obs_key"
        type: string
        required: false
        description: |
          .obs column whose unique values identify terminal-state populations.
          If not provided, Palantir selects terminal states automatically.
      - name: "--num_waypoints"
        type: integer
        default: 500
        required: false
        description: Number of waypoint cells for Palantir (use 1200 for large datasets).
      - name: "--palantir_n_components"
        type: integer
        default: 10
        required: false
        description: Number of diffusion-map components. Reduce for small datasets (< 1000 cells).
      - name: "--palantir_knn"
        type: integer
        default: 30
        required: false
        description: k-nearest neighbours for the Palantir diffusion map. Reduce for small datasets.

  - name: Pseudotime dynamics
    arguments:
      - name: "--obs_pseudotime"
        type: string
        default: "palantir_pseudotime"
        required: false
        description: .obs column with pseudotime values (output of trajectory/palantir).
      - name: "--n_splines"
        type: integer
        default: 8
        required: false
        description: Number of B-spline basis functions for the GAM smooth.
      - name: "--dynamics_lam"
        type: double
        default: 0.6
        required: false
        description: Smoothing regularisation penalty for the GAM (higher = smoother).
      - name: "--uns_dynamics"
        type: string
        default: "dynamics"
        required: false
        description: .uns key where per-subpopulation dynamics dicts are stored.

  - name: Cellular communities
    arguments:
      - name: "--n_communities"
        type: integer
        required: true
        min: 2
        description: Number of cellular communities to detect.
        example: 6
      - name: "--communities_alpha"
        type: double
        default: 0.5
        required: false
        description: |
          Weight for co-occurrence similarity (vs. dynamics similarity).
          0.0 = dynamics only; 1.0 = co-occurrence only.
      - name: "--communities_method"
        type: string
        default: "hierarchical"
        choices: [hierarchical, spectral]
        required: false
        description: Clustering method for community detection.

  - name: Trait associations
    arguments:
      - name: "--traits_csv"
        type: file
        required: true
        description: |
          CSV file with participant metadata. Must contain a participant ID column
          (--obs_group) and at least one trait column (--trait_columns).
        example: traits.csv
      - name: "--trait_columns"
        type: string
        multiple: true
        required: true
        description: Trait column(s) in the traits CSV to test for association.
        example: ["diagnosis", "amyloid_score"]
      - name: "--covariate_columns"
        type: string
        multiple: true
        required: false
        description: Covariate column(s) in the traits CSV to include as fixed effects.
        example: ["age", "sex"]
      - name: "--random_effect_column"
        type: string
        required: false
        description: Column in the traits CSV to use as a random-effects grouping variable.
        example: "cohort"
      - name: "--proportion_transform"
        type: string
        default: "none"
        choices: [none, logit, clr]
        required: false
        description: |
          Transformation applied to the proportions before the association models.
          Proportions are compositional, so `clr` (centered log-ratio over the
          subpopulations of a participant) or `logit` are usually more appropriate
          than the raw values.
      - name: "--fdr_method"
        type: string
        default: "bh"
        choices: [bh, bonferroni, none]
        required: false
        description: Multiple-testing correction applied to the association p-values.
      - name: "--fdr_scope"
        type: string
        default: "global"
        choices: [global, per_predictor, per_response]
        required: false
        description: |
          Set of tests the correction is applied over: all (subpopulation, trait)
          pairs at once, within each trait, or within each subpopulation.

  - name: Pathway enrichment (optional)
    arguments:
      - name: "--de_results_csv"
        type: file
        required: false
        description: |
          DE result CSV (e.g. from differential_expression/deseq2). When provided,
          pathway enrichment is run and results stored in uns["pathway_enrichment"].
          When omitted, the step is skipped.
        example: de_results.csv
      - name: "--gene_column"
        type: string
        required: false
        description: Column in the DE CSV with gene symbols. If absent, the row index is used.
        example: "gene"
      - name: "--gene_sets"
        type: string
        multiple: true
        required: false
        description: |
          Enrichr library names, downloaded at runtime. Local GMT files go to
          `--gene_sets_file`. At least one of the two is required when
          `--de_results_csv` is given.
        example: ["MSigDB_Hallmark_2020", "GO_Biological_Process_2023"]
      - name: "--gene_sets_file"
        type: file
        multiple: true
        required: false
        direction: input
        description: Local GMT files with gene sets.
        example: ["hallmark.gmt"]
      - name: "--pathway_method"
        type: string
        default: "prerank"
        choices: [prerank, ora]
        required: false
        description: Enrichment method (prerank GSEA or over-representation analysis).

dependencies:
  - name: stats/calculate_label_proportions
  - name: dimred/phate
  - name: trajectory/palantir
  - name: trajectory/fit_proportion_dynamics
  - name: cluster/label_communities
  - name: stats/test_associations
  - name: interpret/gseapy

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/beyond_test_data

runners:
  - type: nextflow
