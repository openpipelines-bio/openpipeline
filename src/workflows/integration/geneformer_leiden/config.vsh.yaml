name: "geneformer_leiden"
namespace: "workflows/integration"
scope: "public"
description: |
  Embed cells with a pretrained Geneformer model, followed by neighbour
  calculations, leiden clustering and UMAP on the embedding.

  The raw counts are tokenized into Geneformer rank value encodings
  (`transform/geneformer_tokenize`) and embedded
  (`dimred/geneformer_embeddings_extract`); the embedding is stored in
  `--obsm_output`. The embedding step uses a GPU when one is available.

  The clusters and UMAP are where an in silico perturbation starts: the disease
  and healthy clusters given to `workflows/perturbation/geneformer_insilico`
  are read off them.
authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author, maintainer ]
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        description: Path to the sample, with raw counts.
        example: dataset.h5mu
      - name: "--modality"
        description: Which modality to process.
        type: string
        default: "rna"
        required: false
      - name: "--layer"
        type: string
        required: false
        description: Layer holding the raw counts. Defaults to `.X`.
      - name: "--model"
        type: file
        required: true
        description: Directory holding a pretrained Geneformer model.
        example: Geneformer-V2-316M
  - name: Gene ids
    arguments:
      - name: "--var_gene_ids"
        type: string
        required: false
        description: "`.var` column holding the Ensembl gene ids. Defaults to the `.var` index."
      - name: "--sanitize_ensembl_ids"
        type: boolean
        default: true
        description: Whether to remove version numbers from the Ensembl gene ids.
      - name: "--gene_map"
        type: file
        required: false
        description: |
          CSV file mapping gene symbols to Ensembl gene ids, for data that only
          holds gene symbols. See `transform/geneformer_tokenize`.
        example: gene_map.csv
      - name: "--var_gene_names"
        type: string
        required: false
        description: "`.var` column holding the gene symbols to look up in `--gene_map`. Defaults to the `.var` index."
      - name: "--allow_non_integer"
        type: boolean_true
        description: Accept a count matrix holding non-integer values.
  - name: Geneformer options
    arguments:
      - name: "--model_version"
        type: string
        default: "V2"
        choices: ["V1", "V2"]
        description: Geneformer model series of `--model`.
      - name: "--emb_mode"
        type: string
        default: "cell"
        choices: ["cell", "cls"]
        description: "`cell` averages the gene embeddings of a cell, `cls` takes the `<cls>` token embedding (V2 only)."
      - name: "--emb_layer"
        type: integer
        default: 0
        choices: [-1, 0]
        description: "Layer to take the embeddings from: 0 for the last layer, -1 for the second to last layer."
      - name: "--forward_batch_size"
        type: integer
        default: 32
        min: 1
        description: Number of cells per forward pass.
      - name: "--obsm_tokens"
        type: string
        default: "geneformer_tokens"
        description: "In which .obsm slot to store the model input tokens."
      - name: "--obsm_output"
        type: string
        default: "X_geneformer"
        description: "In which .obsm slot to store the Geneformer embedding."
  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Destination path to the output.
        example: output.h5mu
  - name: Neighbour calculation
    arguments:
      - name: "--uns_neighbors"
        type: string
        default: geneformer_integration_neighbors
        description: In which .uns slot to store various neighbor output objects.
      - name: "--obsp_neighbor_distances"
        type: string
        default: "geneformer_integration_distances"
        description: "In which .obsp slot to store the distance matrix between the resulting neighbors."
      - name: "--obsp_neighbor_connectivities"
        type: string
        default: "geneformer_integration_connectivities"
        description: "In which .obsp slot to store the connectivities matrix between the resulting neighbors."
  - name: Clustering options
    arguments:
      - name: "--obs_cluster"
        type: string
        description: |
          Prefix for the .obs keys under which to add the cluster labels. Newly created columns in .obs will
          be created from the specified value for '--obs_cluster' suffixed with an underscore and one of the
          resolutions specified in '--leiden_resolution'.
        default: "geneformer_integration_leiden"
      - name: "--leiden_resolution"
        type: double
        description: Control the coarseness of the clustering. Higher values lead to more clusters.
        default: [1]
        multiple: true
  - name: Umap options
    arguments:
      - name: "--obsm_umap"
        type: string
        default: "X_geneformer_umap"
        required: false
        description: "In which .obsm slot to store the resulting UMAP embedding."
dependencies:
  - name: transform/geneformer_tokenize
  - name: dimred/geneformer_embeddings_extract
  - name: workflows/multiomics/neighbors_leiden_umap
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/
test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/pbmc_1k_protein_v3
  - path: /resources_test/geneformer
runners:
  - type: nextflow
