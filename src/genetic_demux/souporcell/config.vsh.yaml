name: souporcell
namespace: genetic_demux
scope: "public"
description: "souporcell is a method for clustering mixed-genotype scRNAseq experiments by individual."
authors:
  - __merge__: /src/authors/xichen_wu.yaml
    roles: [ author ]
argument_groups:
- name: "Input"
  arguments:
  - name: "--fasta"
    type: file
    description: reference fasta file
    example: reference.fasta
  - name: "--bam"
    type: file
    description: cellranger bam
    example: input.bam
  - name: "--bam_index"
    type: file
    description: cellranger bam index
    example: input.bam.bai
  - name: "--barcodes"
    type: file
    description: barcodes.tsv from cellranger
    example: barcodes.tsv
  - name: "--clusters"
    type: integer
    description: number cluster, tbd add easy way to run on a range of k
  - name: "--ploidy"
    type: integer
    default: 2
    choices: [1, 2]
    description: ploidy, must be 1 or 2
  - name: "--clustering_method"
    type: string
    choices: ["em", "khm"]
    description: |
      Clustering method: expectation maximization (em) or k harmonic means (khm).
      When not specified, souporcell uses its default (em). For datasets with more than 16 donors,
      khm in combination with --souporcell3 is recommended.
  - name: "--souporcell3"
    type: boolean_true
    description: |
      Use souporcell3, which iterates multiple times to refine the results.
      Suitable for datasets with a high number of donors (>16).
  - name: "--min_alt"
    type: integer
    default: 10
    description: min alt to use locus
  - name: "--min_ref"
    type: integer
    default: 10
    description: min ref to use locus
  - name: "--max_loci"
    type: integer
    default: 2048
    description: max loci per cell, affects speed
  - name: "--restarts"
    type: integer
    description: |
      Number of restarts in clustering, when there are > 12 clusters we recommend increasing this to avoid local minima.
      When not specified, souporcell uses its default (100).
  - name: "--common_variants"
    type: file
    example: common_variants.vcf
    description: common variant loci or known variant loci vcf, must be vs same reference fasta
  - name: "--known_genotypes"
    type: file
    description: known variants per clone in population vcf mode
    example: known_variants.vcf
  - name: "--known_genotypes_sample_names"
    type: string
    multiple: true
    description: |
      Which samples in the population vcf from the known genotypes option represent the donors in your sample.
      The number of sample names must be equal to the number of clusters.
  - name: "--skip_remap"
    type: boolean_true
    description: dont remap with minimap2 (not recommended unless in conjunction with --common_variants)
  - name: "--max_base_mem"
    type: string
    example: "4G"
    description: |
      Maximum number of target bases loaded into RAM by minimap2 for indexing (minimap2 -I).
      Increase this when minimap2 splits the index, which interferes with the retagging step.
  - name: "--no_umi"
    type: boolean_true
    description: Set if your BAM file has no UMI tag. Overrides --umi_tag.
  - name: "--umi_tag"
    type: string
    default: "UB"
    description: The BAM tag containing the UMI.
  - name: "--ignore"
    type: boolean_true
    description: ignore data error assertions
- name: "Output"
  arguments:
  - name: "--output"
    alternatives: [ "-o" ]
    type: file
    direction: output
    description: name of directory to place souporcell files
    example: "souporcell_out"
resources:
  - type: bash_script
    path: script.sh
test_resources:
  - type: bash_script
    path: test.sh
  - path: ../../../resources_test/demuxafy_test_data

engines:
- type: docker
  image: quay.io/biocontainers/souporcell:3.0--hfa8f182_0
  setup:
    # The conda environment (including the compilers pystan needs to build its
    # model at runtime in consensus.py) is normally activated by the image entrypoint,
    # which is bypassed when running the component. Non-interactive bash shells
    # source the file in BASH_ENV on startup, so use that to activate it instead.
    - type: docker
      env:
        - BASH_ENV=/usr/local/env-activate.sh

runners:
- type: executable
- type: nextflow
  directives:
    label: [ highmem, highcpu ]
