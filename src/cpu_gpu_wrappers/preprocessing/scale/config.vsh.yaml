name: scale
namespace: "cpu_gpu_wrappers/preprocessing"
scope: "private"
description: |
  Scale data to unit variance and (optionally) zero mean, running either the
  GPU (rapids-singlecell) or the CPU (scanpy) variant of scale, selected
  with --device_type.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        direction: input
        description: Input h5mu file.
        example: input.h5mu
      - name: "--modality"
        type: string
        default: "rna"
        description: Which modality from the input MuData file to process.
      - name: "--input_layer"
        type: string
        description: Input layer to use. By default, X is scaled.

  - __merge__: /src/base/device_type_argument.yaml

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu file.
        example: output.h5mu
      - name: "--output_layer"
        type: string
        description: Output layer to use. By default, use X.

  - name: Options
    arguments:
      - name: "--zero_center"
        type: boolean
        default: true
        description: |
          If True, center the data to zero mean before scaling. If False,
          omit zero-centering, which preserves sparsity.
      - name: "--max_value"
        type: double
        description: |
          Clip (truncate) values to this maximum after scaling. By default,
          values are not clipped.

dependencies:
  - name: preprocessing/scale
    repository: openpipeline_rapids
    alias: scale_gpu
  - name: transform/scale
    alias: scale_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_gpu_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
