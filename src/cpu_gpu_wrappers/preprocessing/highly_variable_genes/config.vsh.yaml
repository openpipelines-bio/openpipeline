name: highly_variable_genes
namespace: "cpu_gpu_wrappers/preprocessing"
scope: "private"
description: |
  Annotate highly variable genes, running either the GPU (rapids-singlecell) or
  the CPU (scanpy) variant of highly_variable_genes, selected with --device_type.

  Expects log-normalized data for the default 'seurat' flavor. The GPU variant
  exposes additional flavors ('seurat_v3_paper', 'pearson_residuals',
  'poisson_gene_selection') that the CPU variant does not support.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        direction: input
        description: Input h5mu file.
        example: input.h5mu
      - name: "--modality"
        type: string
        default: "rna"
        description: Which modality from the input MuData file to process.
      - name: "--input_layer"
        type: string
        description: |
          Input layer to use for expression values. By default, X is used.

  - __merge__: /src/base/device_type_argument.yaml

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu file.
        example: output.h5mu
      - name: "--var_name_filter"
        type: string
        default: "highly_variable"
        description: |
          In which .var slot to store a boolean array indicating which features
          are highly variable.
      - name: "--varm_name"
        type: string
        default: "hvg"
        description: |
          In which .varm slot to store the per-gene HVG metrics.

  - name: Options
    arguments:
      - name: "--flavor"
        type: string
        default: "seurat"
        choices:
          - "seurat"
          - "cell_ranger"
          - "seurat_v3"
          - "seurat_v3_paper"
          - "pearson_residuals"
          - "poisson_gene_selection"
        description: |
          Choose the flavor for identifying highly variable genes. For the
          dispersion-based methods in their default workflows, Seurat passes
          the cutoffs whereas Cell Ranger passes n_top_features. The
          'seurat_v3_paper', 'pearson_residuals' and 'poisson_gene_selection'
          flavors are only available on the GPU (rapids-singlecell) variant.
      - name: "--n_top_features"
        type: integer
        required: false
        description: |
          Number of highly-variable features to keep. Mandatory if flavor is
          'seurat_v3', 'seurat_v3_paper', 'pearson_residuals' or
          'poisson_gene_selection'.
      - name: "--min_mean"
        type: double
        default: 0.0125
        description: |
          If n_top_features is defined, this and all other cutoffs for the
          means and the normalized dispersions are ignored. Only used for
          dispersion-based flavors.
      - name: "--max_mean"
        type: double
        default: 3
        description: |
          If n_top_features is defined, this and all other cutoffs for the
          means and the normalized dispersions are ignored. Only used for
          dispersion-based flavors.
      - name: "--min_disp"
        type: double
        default: 0.5
        description: |
          If n_top_features is defined, this and all other cutoffs for the
          means and the normalized dispersions are ignored. Only used for
          dispersion-based flavors.
      - name: "--max_disp"
        type: double
        required: false
        description: |
          If n_top_features is defined, this and all other cutoffs for the
          means and the normalized dispersions are ignored. Only used for
          dispersion-based flavors. Default is +inf.
      - name: "--span"
        type: double
        default: 0.3
        description: |
          The fraction of the data (cells) used when estimating the variance
          in the loess model fit if flavor is 'seurat_v3' or 'seurat_v3_paper'.
      - name: "--n_bins"
        type: integer
        default: 20
        description: |
          Number of bins for binning the mean gene expression. Normalization is
          done with respect to each bin. If just a single gene falls into a
          bin, the normalized dispersion is artificially set to 1.
      - name: "--obs_batch_key"
        type: string
        required: false
        description: |
          If specified, highly-variable features are selected within each
          batch separately and merged.

  - name: rapids-singlecell options
    description: Exposed only by the GPU (rapids-singlecell) variant (--device_type gpu).
    arguments:
      - name: "--theta"
        type: integer
        default: 100
        description: |
          The negative binomial overdispersion parameter for Pearson residuals.
          Higher values correspond to less overdispersion. Only used if flavor
          is 'pearson_residuals'.
      - name: "--clip"
        type: double
        required: false
        description: |
          Determines if and how Pearson residuals are clipped. If unset,
          residuals are clipped to [-sqrt(n_obs), sqrt(n_obs)]. If a scalar c is
          given, residuals are clipped to [-c, c]. Only used if flavor is
          'pearson_residuals'.
      - name: "--chunksize"
        type: integer
        default: 1000
        description: |
          If flavor is 'poisson_gene_selection', this determines how many genes
          are processed at once. Choosing a smaller value will reduce the
          required memory.
      - name: "--n_samples"
        type: integer
        default: 10000
        description: |
          The number of Binomial samples used to estimate the posterior
          probability of enrichment of zeros for each gene. Only used if flavor
          is 'poisson_gene_selection'.
      - name: "--check_values"
        type: boolean
        default: true
        description: |
          Check if counts in the selected layer are integers. A warning is
          emitted otherwise. Only used if flavor is 'seurat_v3',
          'seurat_v3_paper', 'pearson_residuals' or 'poisson_gene_selection'.

  - name: Scanpy options
    description: Exposed only by the CPU (scanpy) variant (--device_type cpu).
    arguments:
      - name: "--var_input"
        type: string
        required: false
        description: |
          If specified, use boolean array in adata.var[var_input] to calculate
          hvg on subset of vars.
      - name: "--features_to_exclude"
        type: string
        multiple: true
        required: false
        description: |
          User-defined list of feature names to exclude before HVG calculation.
          These features will be excluded from HVG selection but will remain in
          the output data.
        example: ["MT-CO1", "MT-CO2", "MT-ND1"]

dependencies:
  - name: preprocessing/highly_variable_genes
    repository: openpipeline_rapids
    alias: highly_variable_genes_gpu
  - name: feature_annotation/highly_variable_features_scanpy
    alias: highly_variable_genes_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_gpu_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
