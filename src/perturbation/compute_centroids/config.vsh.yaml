name: compute_centroids
namespace: "perturbation"
scope: "public"
description: |
  Compute the centroid of an `.obsm` embedding for each group of cells.

  The centroid of a group is the per-dimension median (or mean) of the
  embeddings of its cells. The result is a DataFrame in `.uns` with one row per
  group and one column per embedding dimension. In an in silico perturbation
  these are the healthy and disease centroids that the perturbed cells are
  compared to.
authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author, maintainer ]
argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        description: Input h5mu file.
        direction: input
        required: true
        example: input.h5mu
      - name: "--modality"
        description: Which modality from the input MuData file to process.
        type: string
        default: "rna"
        required: false
      - name: "--obsm_input"
        type: string
        default: "X_geneformer"
        description: "`.obsm` key holding the embedding."
      - name: "--obs_group"
        type: string
        default: "perturbation_group"
        description: "`.obs` column holding the group of each cell."
      - name: "--obs_filter"
        type: string
        required: false
        description: "Boolean `.obs` column; only the cells where it is true are used."
        example: "perturbation_selected"
  - name: Options
    arguments:
      - name: "--groups"
        type: string
        required: false
        multiple: true
        description: Groups to compute a centroid for. Defaults to every group in `--obs_group`.
        example: ["disease", "healthy"]
      - name: "--method"
        type: string
        default: "median"
        choices: ["median", "mean"]
        description: How to summarize the embeddings of a group.
      - name: "--min_cells"
        type: integer
        default: 1
        min: 1
        description: Fail when a group has fewer cells.
  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        description: Output h5mu file.
        direction: output
        required: true
        example: output.h5mu
      - name: "--uns_output"
        type: string
        default: "perturbation_centroids"
        description: "`.uns` key for the centroids, a DataFrame with one row per group."
    __merge__: [., /src/base/h5_compression_argument.yaml]
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/compress_h5mu.py
test_resources:
  - type: python_script
    path: test.py
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: /src/base/requirements/anndata_mudata.yaml
    __merge__: [/src/base/requirements/python_test_setup.yaml, .]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [singlecpu, lowmem, lowdisk]
