name: "from_bdrhap_to_h5mu"
namespace: "convert"
scope: "public"
description: |
  Convert the output of the BD Rhapsody Sequence Analysis pipeline to a MuData h5 file.

  The TCR/BCR contigs are stored in the 'vdj_t', 'vdj_t_gd' and 'vdj_b' modalities, using the
  scirpy data structure. These modalities contain all contigs for all cell labels, not only for
  the putative cells. Whether a cell label is a putative cell is stored in the 'putative_cell'
  column of '.obs'.
authors:
  - __merge__: /src/authors/dorien_roosen.yaml
    roles: [ author ]
  - __merge__: /src/authors/robrecht_cannoodt.yaml
    roles: [ author ]
argument_groups:
  - name: Inputs
    arguments:
      - name: "--id"
        type: string
        description: "A sample ID."
        example: my_id
        required: true
      - name: "--input"
        alternatives: [-i]
        type: file
        description: |
          The Cellismo (.cellismo) or MuData (.h5mu) file generated by the BD Rhapsody Sequence Analysis pipeline.
        required: true
        example: sample.cellismo
      - name: "--input_vdj_contigs"
        type: file
        description: |
          The unfiltered VDJ contigs in AIRR format ('*_VDJ_Unfiltered_Contigs_AIRR.tsv.gz') generated by the
          BD Rhapsody Sequence Analysis pipeline. Required when the input contains VDJ data.
        required: false
        example: sample_VDJ_Unfiltered_Contigs_AIRR.tsv.gz
  - name: Outputs
    arguments:
      - name: "--output"
        alternatives: [-o]
        direction: output
        type: file
        description: "Output h5mu file."
        required: true
        example: output.h5mu
__merge__: [., /src/base/h5_compression_argument.yaml]

resources:
  - type: python_script
    path: script.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/bdrhap_5kjrt/processed/output_raw/sample.cellismo
  - path: /resources_test/bdrhap_vdj/processed/output_raw/sample.cellismo
    dest: bdrhap_vdj/sample.cellismo
  - path: /resources_test/bdrhap_vdj/processed/output_raw/sample_VDJ_Unfiltered_Contigs_AIRR.tsv.gz
    dest: bdrhap_vdj/sample_VDJ_Unfiltered_Contigs_AIRR.tsv.gz
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [/src/base/requirements/anndata_mudata.yaml, .]
        packages:
          - scirpy
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowmem, singlecpu]
