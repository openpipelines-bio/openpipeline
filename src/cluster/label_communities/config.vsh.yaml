name: label_communities
namespace: "cluster"
scope: "public"
description: |
  Detects cellular communities by combining co-occurrence and dynamics similarity
  of subpopulations  -  the core clustering step of the BEYOND methodology.

  This is a group-level component: it works on a group x label proportion table,
  not on cells, and never opens a MuData.

  Two label x label similarity matrices are computed:

  1. **Co-occurrence similarity**: correlation of group (e.g. participant)
     proportion vectors across labels. Labels that tend to expand or contract
     together receive a high score. The reference implementation uses Spearman
     (`--correlation_method`).

  2. **Dynamics similarity**: Pearson correlation of the spline-fitted proportion
     curves along pseudotime (`--dynamics`, from `trajectory/fit_proportion_dynamics`).
     Labels with parallel temporal trajectories receive a high score.

  The combined similarity (weighted sum controlled by `--alpha`) is converted to a
  distance matrix and Ward-linkage hierarchical clustering is applied to group
  labels into `--n_communities` cellular communities.

  To carry the community labels back onto cells, join `--output` onto `.obs` with
  `metadata/join_csv`.

keywords: [ cellular communities, clustering, co-occurrence, dynamics, BEYOND ]
links:
  repository: https://github.com/naomihabiblab/BEYOND_DLPFC
references:
  doi: 10.1038/s41586-024-07871-6
license: MIT
authors:
  - __merge__: /src/authors/marilyn_degraeve.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        alternatives: ["-i"]
        type: file
        direction: input
        required: true
        description: |
          CSV with the group x label proportion matrix: an identifier column plus one
          numeric column per label
          (`--output_csv` of `stats/calculate_label_proportions`).
        example: proportions.csv

      - name: "--dynamics"
        type: file
        direction: input
        required: false
        description: |
          Long-format CSV of fitted proportion curves with columns `label`,
          `pseudotime` and `proportion_fitted` (`--output` of
          `trajectory/fit_proportion_dynamics`). Required unless `--alpha` is 1.0.
        example: dynamics.csv

      - name: "--id_column"
        type: string
        required: false
        description: Identifier column of `--input`. Defaults to its first column.
        example: "participant_id"

  - name: Arguments
    arguments:
      - name: "--n_communities"
        type: integer
        required: true
        min: 2
        description: Number of cellular communities to detect.
        example: 6

      - name: "--alpha"
        type: double
        default: 0.5
        min: 0.0
        max: 1.0
        required: false
        description: |
          Weight for the co-occurrence similarity matrix.
          Final similarity = alpha * co_occurrence + (1 - alpha) * dynamics.
          Set to 1.0 for purely co-occurrence-based clustering, 0.0 for dynamics only.

      - name: "--correlation_method"
        type: string
        default: "spearman"
        choices: [pearson, spearman]
        required: false
        description: |
          Correlation used for the co-occurrence similarity. The BEYOND reference
          implementation uses Spearman, which is robust to the skew of compositional
          proportions.

      - name: "--method"
        type: string
        default: "hierarchical"
        choices: [hierarchical, spectral]
        required: false
        description: Clustering method. 'hierarchical' uses Ward linkage; 'spectral' uses spectral clustering.

      - name: "--linkage"
        type: string
        default: "ward"
        choices: [ward, complete, average, single]
        required: false
        description: Linkage criterion for hierarchical clustering. Ignored when --method spectral.

  - name: Outputs
    arguments:
      - name: "--output"
        alternatives: ["-o"]
        type: file
        direction: output
        required: true
        description: |
          CSV with one row per label: `label`, `community_id`.
        example: communities.csv

      - name: "--output_similarity"
        type: file
        direction: output
        required: false
        description: |
          Long-format CSV of the similarity matrices, one row per label pair:
          `label_1`, `label_2`, `co_occurrence`, `dynamics`, `combined`.
        example: community_similarity.csv

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/group_table.py

test_resources:
  - type: python_script
    path: test.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/group_table.py

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        packages:
          - pandas
          - numpy
          - scipy
          - scikit-learn
    test_setup:
      - type: python
        __merge__: [/src/base/requirements/viashpy.yaml, .]

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midcpu, midmem, middisk]
