name: normalize_total
namespace: "wrappers/preprocessing"
scope: "private"
description: |
  Normalize counts per cell, running either the GPU (rapids-singlecell) or the
  CPU (scanpy) variant of normalize_total, selected with --device_type.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        direction: input
        description: Input h5mu file.
        example: input.h5mu
      - name: "--modality"
        type: string
        default: "rna"
        description: Which modality from the input MuData file to process.
      - name: "--input_layer"
        type: string
        description: Input layer to use. By default, X is normalized.

  - __merge__: /src/base/device_type_argument.yaml

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu file.
        example: output.h5mu
      - name: "--output_layer"
        type: string
        description: Output layer to use. By default, use X.

  - name: Options
    arguments:
      - name: "--target_sum"
        type: integer
        min: 1
        description: |
          If not set, after normalization each observation (cell) has a total
          count equal to the median of total counts for observations (cells)
          before normalization.
      - name: "--exclude_highly_expressed"
        type: boolean_true
        description: |
          Exclude (very) highly expressed genes for the computation of the
          normalization factor (size factor) for each cell.

  - name: rapids-singlecell options
    description: Exposed only by the GPU (rapids-singlecell) variant (--device_type gpu).
    arguments:
      - name: "--max_fraction"
        type: double
        default: 0.05
        description: |
          If exclude_highly_expressed=True, consider cells as highly expressed
          that have more counts than max_fraction of the original total counts
          in at least one cell.

dependencies:
  - name: preprocessing/normalize_total
    repository: openpipeline_rapids
    alias: normalize_total_gpu
  - name: transform/normalize_total
    alias: normalize_total_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_gpu_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
