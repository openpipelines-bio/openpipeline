name: umap
namespace: "wrappers/tools"
scope: "private"
description: |
  UMAP (Uniform Manifold Approximation and Projection), running either the GPU
  (rapids-singlecell) or the CPU (scanpy/squidpy) variant, selected with --device_type.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        direction: input
        description: Input h5mu file.
        example: input.h5mu
      - name: "--modality"
        type: string
        default: "rna"
        description: Which modality from the input MuData file to process.
      - name: "--uns_neighbors"
        type: string
        default: "neighbors"
        description: The `.uns` neighbors slot as output by the `find_neighbors` component.

  - __merge__: /src/base/device_type_argument.yaml

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu file.
        example: output.h5mu
      - name: "--obsm_output"
        type: string
        default: "X_umap"
        description: In which .obsm slot to store the resulting UMAP embedding.

  - name: Options
    arguments:
      - name: "--min_dist"
        type: double
        default: 0.5
        description: |
          The effective minimum distance between embedded points. Smaller
          values will result in a more clustered/clumped embedding where
          nearby points on the manifold are drawn closer together, while
          larger values will result on a more even dispersal of points. The
          value should be set relative to the spread value, which determines
          the scale at which embedded points will be spread out.
      - name: "--spread"
        type: double
        default: 1.0
        description: |
          The effective scale of embedded points. In combination with
          `min_dist` this determines how clustered/clumped the embedded
          points are.
      - name: "--num_components"
        type: integer
        default: 2
        description: The number of dimensions of the embedding.
      - name: "--max_iter"
        type: integer
        description: |
          The number of iterations (epochs) of the optimization. Called
          `n_epochs` in the original UMAP.
      - name: "--alpha"
        type: double
        default: 1.0
        description: The initial learning rate for the embedding optimization.
      - name: "--negative_sample_rate"
        type: integer
        default: 5
        description: |
          The number of negative edge/1-simplex samples to use per positive
          edge/1-simplex sample in optimizing the low dimensional embedding.
      - name: "--init_pos"
        type: string
        default: "spectral"
        description: |
          How to initialize the low dimensional embedding. Called `init` in
          the original UMAP. Options are:

          * `'auto'`: chooses `'spectral'` for n_samples < 1000000, `'random'` otherwise.
          * `'spectral'`: use a spectral embedding of the graph.
          * `'random'`: assign initial embedding positions at random.
          * `'paga'`: use the paga() layout as initial embedding positions.
          * Any key from `.obsm`.

  - name: rapids-singlecell options
    description: Exposed only by the GPU (rapids-singlecell) variant (--device_type gpu).
    arguments:
      - name: "--random_state"
        type: integer
        default: 0
        description: Seed used by the random number generator.

  - name: Scanpy options
    description: Exposed only by the CPU (scanpy) variant (--device_type cpu).
    arguments:
      - name: "--gamma"
        type: double
        default: 1.0
        description: |
          Weighting applied to negative samples in low dimensional embedding
          optimization. Values higher than one will result in greater weight
          being given to negative samples.

dependencies:
  - name: tools/umap
    repository: openpipeline_rapids
    alias: umap_gpu
  - name: dimred/umap
    alias: umap_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_gpu_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
