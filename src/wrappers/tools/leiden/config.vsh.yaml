name: leiden
namespace: "wrappers/tools"
scope: "private"
description: |
  Cluster cells using the Leiden algorithm, running either the GPU
  (rapids-singlecell) or the CPU (scanpy) variant of leiden, selected
  with --device_type. Requires a precomputed neighbor graph.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        type: file
        required: true
        direction: input
        description: Input h5mu file.
        example: input.h5mu
      - name: "--modality"
        type: string
        default: "rna"
        description: Which modality from the input MuData file to process.
      - name: "--obsp_connectivities"
        type: string
        default: "connectivities"
        description: In which .obsp slot the neighbor connectivities can be found.

  - __merge__: /src/base/device_type_argument.yaml

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Output h5mu file.
        example: output.h5mu
      - name: "--obsm_name"
        type: string
        default: "leiden"
        description: |
          Name of the .obsm key under which to add the cluster labels.
          The name of the columns in the matrix will correspond to the
          resolutions.

  - name: Options
    arguments:
      - name: "--resolution"
        type: double
        default: [1]
        required: true
        multiple: true
        description: |
          A parameter value controlling the coarseness of the clustering.
          Higher values lead to more clusters. Multiple values will result
          in clustering being performed multiple times.
      - name: "--n_iterations"
        type: integer
        required: false
        default: 100
        description: |
          Maximum number of iterations/levels of the Leiden algorithm. The
          algorithm will terminate after no more than this many iterations.
      - name: "--random_state"
        type: integer
        required: false
        default: 0
        min: 0
        description: |
          Random seed to initialise the optimization. Use this to increase
          reproducibility.

  - name: rapids-singlecell options
    description: Exposed only by the GPU (rapids-singlecell) variant (--device_type gpu).
    arguments:
      - name: "--theta"
        type: double
        required: false
        default: 1.0
        description: |
          Scales modularity gain in the Leiden refinement phase, used to
          compute the probability of joining a random Leiden community.
      - name: "--use_weights"
        type: boolean
        default: true
        description: |
          If true, edge weights from the graph are used in the computation
          (placing more emphasis on stronger edges).

  - name: Scanpy options
    description: Exposed only by the CPU (scanpy) variant (--device_type cpu).
    arguments:
      - name: "--flavor"
        type: string
        choices: ["leidenalg", "igraph"]
        default: "leidenalg"
        description: |
          Which package's implementation to use.

dependencies:
  - name: tools/leiden
    repository: openpipeline_rapids
    alias: leiden_gpu
  - name: cluster/leiden
    alias: leiden_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - type: nextflow_script
    path: test.nf
    entrypoint: test_gpu_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
