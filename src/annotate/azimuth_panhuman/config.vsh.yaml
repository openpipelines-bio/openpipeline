name: azimuth_panhuman
namespace: annotate
scope: "public"
description: |
  Automated cell type annotation using Pan-human Azimuth, a neural network
  pre-trained on a pan-human single-cell atlas by the Satija lab.
authors:
  - __merge__: /src/authors/mirte_detemmerman.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    description: Input dataset (query) arguments
    arguments:
      - name: "--input"
        alternatives: [-i]
        type: file
        description: The input (query) data to be annotated. Should be a .h5mu file.
        direction: input
        required: true
        example: input.h5mu
      - name: "--modality"
        description: Which modality to process.
        type: string
        default: "rna"
        required: false
      - name: "--input_layer"
        type: string
        required: false
        description: |
          The layer in the input data containing raw (unnormalized) counts.
          Azimuth performs its own normalization internally and expects
          integer counts; if not provided, `.X` is used.
      - name: "--input_var_gene_names"
        type: string
        required: false
        default: gene_symbol
        description: |
          The name of the .var column in the input data containing gene
          symbols; when not provided, the .var index is assumed to already
          contain the correct gene identifiers. The Azimuth model was trained
          on gene symbols rather than Ensembl IDs, so this column must
          contain gene symbols for the model to work correctly.
      - name: "--input_reference_gene_overlap"
        type: integer
        default: 100
        min: 1
        description: |
          The minimum number of genes required to be present in both the
          query dataset and the Azimuth reference gene panel. Genes in the
          reference panel that are absent from the query are silently
          zero-filled by Azimuth, so too little overlap produces unreliable
          predictions rather than an outright failure; this argument turns
          that situation into an explicit error.

  - name: Model
    description: |
      Arguments controlling the pre-trained Azimuth neural network. There is
      no reference/training step: the model is fixed and its weights are
      downloaded automatically on first use, unless a local copy is
      provided with `--model`.
    arguments:
      - name: "--model"
        type: file
        required: false
        example: panhumanpy_inference_model_v1.keras
        description: |
          Path to a pre-downloaded Azimuth inference model (a `.keras` file,
          as published on Zenodo: https://zenodo.org/records/20401417). When
          provided, the model is used instead of downloading it, for
          offline component run. The file must match `--model_version`. 
          If not provided, the weights are downloaded automatically on first use.
      - name: "--model_version"
        type: string
        default: "v1"
        choices: ["v0", "v1"]
        description: |
          Which version of the pre-trained Azimuth model to use. Model
          weights are versioned separately from the panhumanpy package;
          currently available versions are 'v0' and 'v1' ('v1' additionally
          applies confidence calibration).
      - name: "--eval_batch_size"
        type: integer
        default: 8192
        min: 1
        description: Batch size used during model inference and minibatched annotation.
      - name: "--normalization_override"
        type: boolean_true
        description: |
          Skip Azimuth's internal normalization and treat `--input_layer`
          (or `.X`) as already log-normalized, instead of raw counts.
          Counts must be normalized to a target sum of 10000 per cell
          (i.e. `sc.pp.normalize_total(target_sum=1e4)` followed by
          `sc.pp.log1p()`); the component verifies this and raises an error
          if the data does not match. Without this flag, the component
          instead verifies that the data looks like raw (integer) counts,
          rather than silently normalizing already-normalized data a
          second time. Only set this flag if your data is already
          normalized in this way.
      - name: "--norm_check_batch_size"
        type: integer
        default: 100
        min: 1
        description: Number of cells sampled to determine whether the input counts are already normalized.
      - name: "--output_mode"
        type: string
        default: "minimal"
        choices: ["minimal", "detailed"]
        description: |
          Controls the verbosity of the annotation columns added to `.obs`.
          'detailed' additionally adds one label column per hierarchical
          depth level (e.g. `level_1_labels`, `level_2_labels`, ...).
      - name: "--refine_labels"
        type: boolean
        default: true
        description: |
          Whether to post-process the raw hierarchical predictions into
          `azimuth_broad`, `azimuth_medium` and `azimuth_fine` label columns
          with consistent granularity across cell types; `azimuth_broad`
          replaces the raw `level_zero_labels` column in this case. If false,
          only the raw hierarchical output columns (including
          `level_zero_labels`) are added.

  - name: Cell Ontology mapping
    description: |
      Optionally map annotation columns to formal Cell Ontology (CL) terms
      using panhumanpy's built-in crosswalk.
    arguments:
      - name: "--map_to_cl"
        type: string
        multiple: true
        required: false
        description: |
          One or more `.obs` column names (produced by this component,
          e.g. `azimuth_broad`, `azimuth_fine`, `level_zero_labels`) to map
          to Cell Ontology terms. Use the original Azimuth column names, not
          the names set with the `--output_obs_*` arguments. For each column
          `<col>`, a `<col>_CL` column is added (also keeping the original
          name). If not provided, no Cell Ontology mapping is
          performed.
        example: [azimuth_broad, azimuth_fine]
      - name: "--include_cl_id"
        type: boolean_true
        description: |
          If set, also add a `<col>_CL_ID` column with the Cell Ontology
          identifier (e.g. "CL:0000236") next to each `<col>_CL` column
          produced by `--map_to_cl`.

  - name: Embeddings and UMAP
    description: |
      Arguments controlling extraction of the Azimuth neural network's
      internal cell embeddings, and an optional UMAP projection thereof.
    arguments:
      - name: "--extract_embeddings"
        type: boolean
        default: true
        description: Whether to extract the Azimuth neural network embeddings for each cell.
      - name: "--umap_embeddings"
        type: boolean
        default: true
        description: |
          Whether to compute a UMAP projection of the extracted embeddings.
          Requires `--extract_embeddings true`.
      - name: "--umap_n_neighbors"
        type: integer
        default: 30
        min: 1
        description: Number of neighbors to consider for each point in the UMAP.
      - name: "--umap_n_components"
        type: integer
        default: 2
        min: 1
        description: Dimensionality of the UMAP projection.
      - name: "--umap_metric"
        type: string
        default: "cosine"
        description: Distance metric to use for the UMAP.
      - name: "--umap_min_dist"
        type: double
        default: 0.3
        description: Minimum distance between points in the UMAP projection.
      - name: "--umap_lr"
        type: double
        default: 1.0
        description: UMAP learning rate.
      - name: "--umap_seed"
        type: integer
        default: 42
        description: Random seed for reproducibility of the UMAP.
      - name: "--umap_spread"
        type: double
        default: 1.0
        description: Scales the effective scale of embedded points in the UMAP.
      - name: "--umap_init"
        type: string
        default: "spectral"
        choices: ["spectral", "random"]
        description: Initialization method for the UMAP.
      - name: "--umap_verbose"
        type: boolean
        default: false
        description: Whether to print UMAP progress to the log.

  - name: Outputs
    description: Output arguments.
    arguments:
      - name: "--output"
        type: file
        description: Output h5mu file.
        direction: output
        example: output.h5mu
      - name: "--output_obs_predictions"
        type: string
        default: "azimuth_pred"
        required: false
        description: |
          In which `.obs` column to store the most granular ('final level')
          predicted cell type label. Azimuth also always adds several other
          hierarchical label columns (see `--output_mode`) whose names are
          not configurable.
      - name: "--output_obs_probability"
        type: string
        default: "azimuth_probability"
        required: false
        description: |
          In which `.obs` column to store the (calibrated) confidence score
          of the `--output_obs_predictions` label.
      - name: "--output_obs_predictions_broad"
        type: string
        default: "azimuth_broad"
        required: false
        description: |
          In which `.obs` column to store the refined broad-granularity cell
          type label. Only used if `--refine_labels` is set.
      - name: "--output_obs_predictions_medium"
        type: string
        default: "azimuth_medium"
        required: false
        description: |
          In which `.obs` column to store the refined medium-granularity cell
          type label. Only used if `--refine_labels` is set.
      - name: "--output_obs_predictions_fine"
        type: string
        default: "azimuth_fine"
        required: false
        description: |
          In which `.obs` column to store the refined fine-granularity cell
          type label. Only used if `--refine_labels` is set.
      - name: "--output_obsm_embedding"
        type: string
        default: "X_azimuth"
        required: false
        description: |
          In which `.obsm` slot to store the extracted Azimuth embeddings.
          Only used if `--extract_embeddings` is set.
      - name: "--output_obsm_umap"
        type: string
        default: "X_azimuth_umap"
        required: false
        description: |
          In which `.obsm` slot to store the UMAP projection.
          Only used if `--umap_embeddings` is set.
    __merge__: [., /src/base/h5_compression_argument.yaml]

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/cross_check_genes.py
  - path: /src/utils/set_var_index.py
  - path: /src/utils/is_lognormalized.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3/pbmc_1k_protein_v3_filtered_feature_bc_matrix.h5mu

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: python
        packages:
          - panhumanpy[gpu]==1.0.0
      - type: python
        __merge__: [ /src/base/requirements/anndata_mudata.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midcpu, highmem, highdisk, gpu]
