name: azimuth
namespace: annotate
scope: "public"
description: |
  Automated cell type annotation using Pan-human Azimuth, a neural network
  pre-trained on a pan-human single-cell atlas by the Satija lab. Unlike
  celltypist or singleR, Azimuth does not train on a user-provided
  reference: the model is fixed, so only a query dataset is required.
authors:
  - __merge__: /src/authors/mirte_de_temmerman.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    description: Input dataset (query) arguments
    arguments:
      - name: "--input"
        alternatives: [-i]
        type: file
        description: The input (query) data to be annotated. Should be a .h5mu file.
        direction: input
        required: true
        example: input.h5mu
      - name: "--modality"
        description: Which modality to process.
        type: string
        default: "rna"
        required: false
      - name: "--input_layer"
        type: string
        required: false
        description: |
          The layer in the input data containing raw (unnormalized) counts.
          Azimuth performs its own normalization internally and expects
          integer counts; if not provided, `.X` is used.
      - name: "--input_var_gene_names"
        type: string
        required: false
        description: |
          The name of the .var column in the input data containing gene
          symbols; when not provided, the .var index is assumed to already
          contain the correct gene identifiers.
      - name: "--sanitize_ensembl_ids"
        type: boolean
        description: |
          Whether to sanitize the gene identifiers used for matching against
          the Azimuth reference gene panel by removing Ensembl version
          suffixes (e.g. "ENSG00000121410.11" becomes "ENSG00000121410").
        default: false
      - name: "--input_reference_gene_overlap"
        type: integer
        default: 100
        min: 1
        description: |
          The minimum number of genes required to be present in both the
          query dataset and the Azimuth reference gene panel. Genes in the
          reference panel that are absent from the query are silently
          zero-filled by Azimuth, so too little overlap produces unreliable
          predictions rather than an outright failure; this argument turns
          that situation into an explicit error.

  - name: Model
    description: |
      Arguments controlling the pre-trained Azimuth neural network. There is
      no reference/training step: the model is fixed and its weights are
      downloaded automatically on first use.
    arguments:
      - name: "--model_version"
        type: string
        default: "v1"
        description: |
          Which version of the pre-trained Azimuth model to use. Model
          weights are versioned separately from the panhumanpy package;
          currently available versions are 'v0' and 'v1' ('v1' additionally
          applies confidence calibration).
      - name: "--annotation_pipeline"
        type: string
        default: "supervised"
        description: |
          The annotation pipeline to run. Currently only 'supervised' (the
          package default) is implemented by panhumanpy.
      - name: "--eval_batch_size"
        type: integer
        default: 8192
        min: 1
        description: Batch size used during model inference and minibatched annotation.
      - name: "--normalization_override"
        type: boolean_true
        description: |
          Skip the check for whether `--input_layer` (or `.X`) already
          contains raw counts, and process the data as-is. Without this
          flag, the component raises an error if the data does not look
          like raw counts (i.e. contains non-integer values), rather than
          silently normalizing already-normalized data a second time. Only
          set this flag if you are certain the check produces a false
          positive on your data.
      - name: "--norm_check_batch_size"
        type: integer
        default: 100
        min: 1
        description: Number of cells sampled to determine whether the input counts are already normalized.
      - name: "--output_mode"
        type: string
        default: "minimal"
        choices: ["minimal", "detailed"]
        description: |
          Controls the verbosity of the annotation columns added to `.obs`.
          'detailed' additionally adds one label column per hierarchical
          depth level (e.g. `level_1_labels`, `level_2_labels`, ...).
      - name: "--refine_labels"
        type: boolean
        default: true
        description: |
          Whether to post-process the raw hierarchical predictions into
          `azimuth_broad`, `azimuth_medium` and `azimuth_fine` label columns
          with consistent granularity across cell types; `azimuth_broad`
          replaces the raw `level_zero_labels` column in this case. If false,
          only the raw hierarchical output columns (including
          `level_zero_labels`) are added.

  - name: Cell Ontology mapping
    description: |
      Optionally map annotation columns to formal Cell Ontology (CL) terms
      using panhumanpy's built-in crosswalk.
    arguments:
      - name: "--map_to_cl"
        type: string
        multiple: true
        required: false
        description: |
          One or more `.obs` column names (produced by this component,
          e.g. `azimuth_broad`, `azimuth_fine`, `level_zero_labels`) to map
          to Cell Ontology terms. For each column `<col>`, a `<col>_CL`
          column is added. If not provided, no Cell Ontology mapping is
          performed.
        example: [azimuth_broad, azimuth_fine]
      - name: "--include_cl_id"
        type: boolean_true
        description: |
          If set, also add a `<col>_CL_ID` column with the Cell Ontology
          identifier (e.g. "CL:0000236") next to each `<col>_CL` column
          produced by `--map_to_cl`.

  - name: Embeddings and UMAP
    description: |
      Arguments controlling extraction of the Azimuth neural network's
      internal cell embeddings, and an optional UMAP projection thereof.
    arguments:
      - name: "--extract_embeddings"
        type: boolean
        default: true
        description: Whether to extract the Azimuth neural network embeddings for each cell.
      - name: "--umap_embeddings"
        type: boolean
        default: true
        description: |
          Whether to compute a UMAP projection of the extracted embeddings.
          Requires `--extract_embeddings true`.
      - name: "--umap_n_neighbors"
        type: integer
        default: 30
        min: 1
        description: Number of neighbors to consider for each point in the UMAP.
      - name: "--umap_n_components"
        type: integer
        default: 2
        min: 1
        description: Dimensionality of the UMAP projection.
      - name: "--umap_metric"
        type: string
        default: "cosine"
        description: Distance metric to use for the UMAP.
      - name: "--umap_min_dist"
        type: double
        default: 0.3
        description: Minimum distance between points in the UMAP projection.
      - name: "--umap_lr"
        type: double
        default: 1.0
        description: UMAP learning rate.
      - name: "--umap_seed"
        type: integer
        default: 42
        description: Random seed for reproducibility of the UMAP.
      - name: "--umap_spread"
        type: double
        default: 1.0
        description: Scales the effective scale of embedded points in the UMAP.
      - name: "--umap_init"
        type: string
        default: "spectral"
        choices: ["spectral", "random"]
        description: Initialization method for the UMAP.
      - name: "--umap_verbose"
        type: boolean
        default: false
        description: Whether to print UMAP progress to the log.

  - name: Outputs
    description: Output arguments.
    arguments:
      - name: "--output"
        type: file
        description: Output h5mu file.
        direction: output
        example: output.h5mu
      - name: "--output_obsm_embedding"
        type: string
        default: "X_azimuth"
        required: false
        description: |
          In which `.obsm` slot to store the extracted Azimuth embeddings.
          Only used if `--extract_embeddings` is set.
      - name: "--output_obsm_umap"
        type: string
        default: "X_azimuth_umap"
        required: false
        description: |
          In which `.obsm` slot to store the UMAP projection.
          Only used if `--umap_embeddings` is set.
    __merge__: [., /src/base/h5_compression_argument.yaml]

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/cross_check_genes.py
  - path: /src/utils/set_var_index.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3/pbmc_1k_protein_v3_filtered_feature_bc_matrix.h5mu

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: python
        packages:
          - panhumanpy==1.0.0
      - type: python
        __merge__: [ /src/base/requirements/anndata_mudata.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midcpu, highmem, highdisk]
