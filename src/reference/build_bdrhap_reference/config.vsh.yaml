name: build_bdrhap_reference
namespace: reference
scope: "public"
description: |
  The Reference Files Generator creates an archive containing Genome Index
  and Transcriptome annotation files needed for the BD Rhapsody Sequencing
  Analysis Pipeline. The app takes as input one or more FASTA and GTF files
  and produces a compressed archive in the form of a tar.gz file. The 
  archive contains:
    
  - STAR index
  - Filtered GTF file
authors:
  - __merge__: /src/authors/robrecht_cannoodt.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - type: file
        name: --genome_fasta
        required: true
        description: Reference genome file in FASTA or FASTA.GZ format. The pre-built BD reference archive files use GRCh38 for Human and GRCm39 for Mouse.
        example: genome_sequence.fa.gz
        multiple: true
        info:
          config_key: Genome_fasta
      - type: file
        name: --gtf
        required: true
        description: |
          File path to the transcript annotation files in GTF or GTF.GZ format. The Sequence Analysis Pipeline requires the 'gene_name' or 
          'gene_id' attribute to be set on each gene and exon feature. Gene and exon feature lines must have the same attribute, and exons
          must have a corresponding gene with the same value. For TCR/BCR assays, the TCR or BCR gene segments must have the 'gene_type' or
          'gene_biotype' attribute set, and the value should begin with 'TR' or 'IG', respectively.
        example: transcriptome_annotation.gtf.gz
        multiple: true
        info:
          config_key: Gtf
      - type: file
        name: --extra_sequences
        description: |
          File path to additional sequences in FASTA format to use when building the STAR and bwa-mem2 indices. (e.g. transgenes or CRISPR guide barcodes).
          GTF lines for these sequences will be automatically generated and combined with the main GTF.
        required: false
        multiple: true
        example: ["extra_sequence_1.fa.gz", "extra_sequence_2.fa.gz"]
        info:
          config_key: Extra_sequences
      - type: file
        name: --transcription_factor_motif_pfm
        description: |
          Text file of Transcription Factor Motif position frequency matrices in JASPAR format. Used to compute a
          TF motif-by-cell matrix in the ATAC-Seq analysis pipeline.
          The pre-built BD reference archive files use the JASPAR2024_CORE_vertebrates_non-redundant_pfms_jaspar.txt file
          for both Human and Mouse. See https://jaspar.elixir.no/download/data/2024/CORE/.
        required: false
        multiple: true
        example: JASPAR2024_CORE_vertebrates_non-redundant_pfms_jaspar.txt
        info:
          config_key: Transcription_Factor_Motif_PFM
  - name: Outputs
    arguments:
      - type: file
        name: --reference_archive
        direction: output
        required: true
        description: |
          A Compressed archive containing the Reference Genome Index and annotation GTF files. This archive is meant to be used as an
          input in the BD Rhapsody Sequencing Analysis Pipeline.
        example: reference.tar.gz
  - name: Arguments
    arguments:
      - type: string
        name: --mitochondrial_contigs
        description: |
          Names of the Mitochondrial contigs in the provided Reference Genome. Fragments originating from contigs other than these are
          identified as 'nuclear fragments' in the ATACseq analysis pipeline.
        required: false
        multiple: true
        default: [chrM, chrMT, M, MT]
        info:
          config_key: Mitochondrial_Contigs
      - type: boolean_true
        name: --filtering_off
        description: |
          By default, the input GTF files are filtered based on the gene_type, gene_biotype, or transcript_type attributes.
          Only genes with a gene_type or gene_biotype matching one of the accepted values are retained, and each gene must
          have at least one transcript with a valid transcript_type. An exception is made to the transcript requirement if
          the gene does not overlap with any other gene that has a valid biotype.

          Accepted biotypes include:

            - protein_coding
            - protein_coding_LOF
            - lncRNA (lincRNA and antisense for Gencode < v31/M22/Ensembl97)
            - IG_LV_gene
            - IG_V_gene
            - IG_V_pseudogene
            - IG_D_gene
            - IG_D_pseudogene
            - IG_J_gene
            - IG_J_pseudogene
            - IG_C_gene
            - IG_C_pseudogene
            - TR_V_gene
            - TR_V_pseudogene
            - TR_D_gene
            - TR_J_gene
            - TR_J_pseudogene
            - TR_C_gene

            If you have already pre-filtered the input Annotation files and/or wish to turn-off the filtering, please set this option to True.
        info:
          config_key: Disable_Biotype_Filtering
      - type: boolean_true
        name: --disable_readthrough_filtering
        description: |
          By default genes with only readthrough transcripts are removed. Any readthrough_transcript feature is also removed
          if its parent gene overlaps with another gene that meets the biotype requirement. Set this option to disable this behaviour.
        info:
          config_key: Disable_Readthrough_Filtering
      - type: boolean_true
        name: --filter_pars
        description: |
          Remove features in the 2 Pseudo-Autosomal Regions (PARs) on the Y chromosome. This applies only to a Human build 38 reference.
        info:
          config_key: Filter_PARs
      - type: boolean_true
        name: --combine_same_gene_names
        description: |
          Combine genes with the same gene name, even when gene ids are different. If not enabled (default), chromosome, start,
          and strand information will be appended to the duplicated gene names.
        info:
          config_key: Combine_Same_Gene_Names
      - type: boolean_true
        name: --wta_only_index
        description: Build a WTA only index, otherwise builds a WTA + ATAC index.
        info:
          config_key: WTA_Only
      - type: boolean_true
        name: --disable_fasta_validation
        description: |
          Skip validation that the FASTA files contain the contigs referenced in the GTF files. Only use this in rare cases
          where you deliberately want to bypass the contig compatibility check.
        info:
          config_key: Disable_FASTA_Validation
      - type: boolean_true
        name: --repair_gtf
        description: |
          Attempt to repair invalid GTF files using the built-in repair functionality. The validator will try to fix common
          GTF format issues and use the repaired files for downstream processing.
        info:
          config_key: Repair_GTF
      - type: boolean_true
        name: --gtf_validation_complete_mode
        description: |
          Generate a full report about errors and warnings in the GTF, instead of failing when the first fatal error is encountered.
        info:
          config_key: GTF_Validation_Complete_Mode
      - type: string
        name: --extra_star_params
        description: Additional parameters to pass to STAR when building the genome index. Specify exactly like how you would on the command line.
        example: --limitGenomeGenerateRAM 48000000000 --genomeSAindexNbases 11
        required: false
        info:
          config_key: Extra_STAR_params

resources:
  - type: python_script
    path: script.py
  - path: make_rhap_reference_4.0.cwl
test_resources:
  - type: bash_script
    path: test.sh
  - path: /resources_test/reference_gencodev41_chr1/reference.fa.gz
  - path: /resources_test/reference_gencodev41_chr1/reference.gtf.gz

engines:
  - type: docker
    image: bdgenomics/rhapsody:4.0
    setup:
      - type: apt
        packages: [procps, seqkit]
      - type: python
        packages: [cwlref-runner, cwl-runner]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ highmem, highcpu ]
