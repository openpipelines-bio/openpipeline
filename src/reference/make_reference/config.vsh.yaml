name: make_reference
namespace: reference
scope: "public"
description: |
  Preprocess and build a transcriptome reference.

  Example input files are:
    - `genome_fasta`: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_41/GRCh38.primary_assembly.genome.fa.gz
    - `transcriptome_gtf`: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_41/gencode.v41.annotation.gtf.gz
    - `ercc`: https://assets.thermofisher.com/TFS-Assets/LSG/manuals/ERCC92.zip
authors:
  - __merge__: /src/authors/angela_pisco.yaml
    roles: [ author ]
  - __merge__: /src/authors/robrecht_cannoodt.yaml
    roles: [ author ]
arguments:
  # inputs
  - type: file
    name: --genome_fasta
    required: true
    description: "Reference genome fasta. Example: "
    example: genome_fasta.fa.gz
  - type: file
    name: --transcriptome_gtf
    required: true
    description: Reference transcriptome annotation.
    example: transcriptome.gtf.gz
  - type: file
    name: --ercc
    description: ERCC sequence and annotation file.
    example: ercc.zip
  - type: string
    name: --ercc_gene_type
    description: Value for the `gene_type` attribute of ERCC features that do not have one.
    default: spike_in_sequence
  - type: string
    name: --ercc_transcript_type
    description: Value for the `transcript_type` attribute of ERCC transcripts and exons that do not have one.
    default: spike_in_sequence
  - type: boolean_true
    name: --ercc_overwrite_types
    description: |
      Also replace existing `gene_type` and `transcript_type` attributes of ERCC features
      with `--ercc_gene_type` and `--ercc_transcript_type`.
  - type: string
    name: --subset_regex
    description: Will subset the reference chromosomes using the given regex.
    example: (ERCC-00002|chr1)
  - type: file
    name: --output_fasta
    direction: output
    required: true
    description: Output genome sequence fasta.
    example: genome_sequence.fa.gz
  - type: file
    name: --output_gtf
    direction: output
    required: true
    description: Output transcriptome annotation gtf.
    example: transcriptome_annotation.gtf.gz
resources:
  - type: bash_script
    path: script.sh
  - path: fix_ercc.py
test_resources:
  - type: bash_script
    path: test.sh
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages: [ pigz, seqkit, curl, wget, unzip, file, procps ]
      - type: python
        packages: [ gtfparse==3.3.0 ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ highmem, highcpu ]